}

function drawStories(body) {
  const list = body.querySelector("#stList");
  if (!list) { if (storiesUnsub) { storiesUnsub(); storiesUnsub = null; } return; }
  const shown = storyFilter ? stories.filter((s) => (s.personIds || []).includes(storyFilter)) : stories;
  list.innerHTML = shown.length ? shown.map((s) => {
    const mine = s.uid === user?.uid;
    const when = s.createdAt?.toDate ? s.createdAt.toDate().toLocaleDateString(loc(), { day: "numeric", month: "long", year: "numeric" }) : "";
    const tags = (s.personIds || []).filter((id) => P(id)).map((id) => `<button class="tag" data-go="${id}">${esc(nm(P(id)))}</button>`).join("");
    const long = (s.text || "").length > 420;
    return `<article class="story" data-s="${s.id}">
      ${s.thumb ? `<button class="story-pic" data-media="${s.id}"><img alt="" src="${esc(s.thumb)}" loading="lazy"></button>` : ""}
      <div class="story-body">
        <h4 dir="auto">${esc(s.title || "")}</h4>
        <div class="meta">✍️ ${esc(s.name)} · ${when}${s.era ? ` · 🕰 ${esc(s.era)}` : ""}${s.edited ? " · " + t("edited") : ""}</div>
        ${tags ? `<div class="tags">${tags}</div>` : ""}
        <p class="story-text ${long ? "clamp" : ""}" dir="auto">${esc(s.text || "")}</p>
        ${long ? `<button class="linkish" data-more="${s.id}">${t("readMore")}</button>` : ""}
        ${s.hasAudio ? `<div class="audio-slot" id="au-${s.id}"><button class="btn" data-audio="${s.id}">🎧 ${t("listen")}</button></div>` : ""}
        ${(isAdmin || mine) ? `<div class="foot" style="justify-content:flex-start;margin:6px 0 0"><button class="btn" data-sedit="${s.id}">✎ ${t("edit")}</button><button class="btn danger" data-sdel="${s.id}">🗑 ${t("del")}</button></div>` : ""}
      </div></article>`;
  }).join("") : `<div class="empty">${storyFilter ? t("noStoriesAbout") : t("noStories")}</div>`;
  list.onclick = async (e) => {
    const go = e.target.closest("[data-go]")?.dataset.go;
    if (go) { closeModal(); select(go); return; }
    const more = e.target.closest("[data-more]")?.dataset.more;
    if (more) { const p = list.querySelector(`[data-s="${more}"] .story-text`); p.classList.remove("clamp"); e.target.remove(); return; }
    const au = e.target.closest("[data-audio]")?.dataset.audio;
    if (au) {
      const slot = list.querySelector(`#au-${au}`); slot.innerHTML = "⏳";
      try { const m = (await getDoc(doc(db, "storyMedia", au))).data() || {}; slot.innerHTML = m.audio ? `<audio controls autoplay src="${esc(m.audio)}"></audio>` : "—"; } catch (er) { console.error(er); slot.innerHTML = t("err"); }
      return;
    }
    const media = e.target.closest("[data-media]")?.dataset.media;
    if (media) {
      const s = stories.find((x) => x.id === media);
      let full = s.thumb;
      try { full = (await getDoc(doc(db, "storyMedia", media))).data()?.photo || s.thumb; } catch (er) { console.error(er); }
      const lb = document.createElement("div"); lb.className = "lightbox";
      lb.innerHTML = `<div class="lb-inner"><div class="lb-media"><img alt="" src="${esc(full)}"></div><div class="lb-bar"><span><b>${esc(s.title || "")}</b></span><button class="btn" data-x>✕</button></div><div class="private-note small">🔒 ${t("privateNoticeShort")}</div></div>`;
      document.body.appendChild(lb);
      pushLayer("lightbox"); closers.lightbox = () => lb.remove();
      lb.onclick = (ev) => { if (ev.target === lb || ev.target.closest("[data-x]")) { lb.remove(); popLayer("lightbox"); } };
      return;
    }
    const del = e.target.closest("[data-sdel]")?.dataset.sdel;
    if (del) {
      const s = stories.find((x) => x.id === del);
      try { if (s.hasPhoto || s.hasAudio) await deleteDoc(doc(db, "storyMedia", del)); await deleteDoc(doc(db, "stories", del)); toast(t("deleted")); } catch (er) { console.error(er); toast(t("err")); }
      return;
    }
    const ed = e.target.closest("[data-sedit]")?.dataset.sedit;
    if (ed) storyComposer(body, stories.find((x) => x.id === ed));
  };
}

function storyComposer(body, existing = null) {
  let photo = null, audio = null, recorder = null, chunks = [], timer = null, secs = 0;
  let tagged = existing ? [...(existing.personIds || [])] : (storyFilter ? [storyFilter] : (myPersonId() ? [] : []));
  const box = document.createElement("div");
  box.className = "composer";
  box.innerHTML = `
    <h3>${existing ? "✎ " + t("editMemory") : "✍️ " + t("writeMemory")}</h3>
    <div class="field"><label>${t("memTitle")}</label><input id="mTitle" maxlength="120" dir="auto" value="${esc(existing?.title)}" placeholder="${t("memTitlePh")}"></div>
    <div class="field"><label>${t("memText")}</label><textarea id="mText" maxlength="5000" rows="7" dir="auto" placeholder="${t("memTextPh")}">${esc(existing?.text)}</textarea></div>
    <div class="field"><label>${t("memPeople")}</label>
      <div class="tags" id="mTags"></div>
      <div class="two">${pickerHtml("mPick", null)}<button class="btn" id="mAdd">＋ ${t("memTag")}</button></div></div>
    <div class="field"><label>🕰 ${t("memEra")}</label><input id="mEra" maxlength="40" value="${esc(existing?.era)}" placeholder="${t("memEraPh")}"></div>
    ${existing ? "" : `
    <div class="two">
      <div class="field"><label>📷 ${t("memPhoto")}</label>${dropHtml()}</div>
      <div class="field"><label>🎙️ ${t("memVoice")}</label>
        <div class="rec"><button class="btn" id="mRec">⏺ ${t("record")}</button><span id="mRecT"></span></div>
        <div id="mRecOut"></div><p class="sub">${t("voiceHint")}</p></div>
    </div>`}
    <div class="foot"><button class="btn" id="mCancel">${t("cancel")}</button><button class="btn primary" id="mSave">${existing ? t("save") : "📖 " + t("publishMemory")}</button></div>`;
  const list = body.querySelector("#stList");
  list.before(box);
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  const drawTags = () => {
    box.querySelector("#mTags").innerHTML = tagged.filter((id) => P(id)).map((id) => `<span class="tag on">${esc(nm(P(id)))} <button data-untag="${id}">✕</button></span>`).join("") || `<span class="sub">${t("memNoTags")}</span>`;
  };
  drawTags();
  box.querySelector("#mTags").onclick = (e) => { const u = e.target.closest("[data-untag]")?.dataset.untag; if (u) { tagged = tagged.filter((x) => x !== u); drawTags(); } };
  box.querySelector("#mAdd").onclick = () => {
    const v = box.querySelector("#mPick").value.trim();
    const o = [...box.querySelectorAll("#mPickL option")].find((x) => x.value === v);
    if (!o) { toast(t("relPick")); return; }
    if (!tagged.includes(o.dataset.id) && tagged.length < 20) tagged.push(o.dataset.id);
    box.querySelector("#mPick").value = ""; drawTags();
  };
  if (!existing) {
    const dropField = box.querySelector(".drop").parentElement;
    const drop = dropField.querySelector(".drop"), inp = dropField.querySelector("input[type=file]");
    drop.onclick = () => inp.click();
    inp.onchange = async () => {
      try { photo = await albumPhoto(inp.files[0]); drop.innerHTML = `<img alt="" src="${photo.thumb}">`; } catch (e) { toast(t("needPhoto")); }
    };
    const recBtn = box.querySelector("#mRec"), recT = box.querySelector("#mRecT"), recOut = box.querySelector("#mRecOut");
    const stop = () => { if (recorder && recorder.state !== "inactive") recorder.stop(); clearInterval(timer); };
    recBtn.onclick = async () => {
      if (recorder && recorder.state === "recording") { stop(); return; }
      const type = pickAudioType();
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { toast(t("noMic")); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        chunks = []; secs = 0;
        recorder = new MediaRecorder(stream, type ? { mimeType: type, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 });
        recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
        recorder.onstop = async () => {
          stream.getTracks().forEach((tr) => tr.stop());
          const blob = new Blob(chunks, { type: recorder.mimeType || type || "audio/webm" });
          const url = await blobToDataUrl(blob);
          if (url.length > 900000) { toast(t("voiceTooLong")); audio = null; recOut.innerHTML = ""; }
          else { audio = url; recOut.innerHTML = `<audio controls src="${url}"></audio>`; }
          recBtn.textContent = "⏺ " + t("recordAgain"); recT.textContent = "";
        };
        recorder.start(1000);
        recBtn.textContent = "⏹ " + t("stop");
        timer = setInterval(() => { secs++; recT.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")} / 3:00`; if (secs >= 180) stop(); }, 1000);
      } catch (e) { console.error(e); toast(t("noMic")); }
    };
  }
  box.querySelector("#mCancel").onclick = () => { if (recorder && recorder.state === "recording") recorder.stop(); box.remove(); };
  box.querySelector("#mSave").onclick = async () => {
    const title = box.querySelector("#mTitle").value.trim(), text = box.querySelector("#mText").value.trim(), era = box.querySelector("#mEra").value.trim();
    if (!title && !text && !audio) { toast(t("memNeed")); return; }
    const btn = box.querySelector("#mSave"); btn.disabled = true;
    try {
      if (existing) {
        const upd = { title, text, era, personIds: tagged, edited: true };
        await updateDoc(doc(db, "stories", existing.id), upd);
      } else {
        const data = { title, text, era, personIds: tagged, uid: user.uid, name: user.displayName || user.email, createdAt: serverTimestamp(), hasPhoto: !!photo, hasAudio: !!audio };
        if (photo) data.thumb = photo.thumb;
        if (user.photoURL) data.photo = user.photoURL.slice(0, 500);
        Object.keys(data).forEach((k) => data[k] === "" && delete data[k]);
        const ref = await addDoc(collection(db, "stories"), data);
        if (photo || audio) {
          const m = { uid: user.uid };
          if (photo) m.photo = photo.full;
          if (audio) m.audio = audio;
          if ((m.photo || "").length + (m.audio || "").length > 950000) delete m.photo; // keep the voice if both are too big
          await setDoc(doc(db, "storyMedia", ref.id), m);
        }
        confetti();
      }
      box.remove(); toast(t("saved"));
    } catch (e) { console.error(e); toast(t("err")); btn.disabled = false; }
  };
}

/* ================= misc controls ================= */
document.getElementById("zIn").onclick = () => svg.transition().call(zoom.scaleBy, 1.35);
document.getElementById("zOut").onclick = () => svg.transition().call(zoom.scaleBy, 1 / 1.35);
document.getElementById("zFit").onclick = () => fit();
document.getElementById("zMe").onclick = () => myId() && select(myId());
const setView = (v) => {
  clearTimeout(introTimer);
  view = v;
  document.getElementById("vTree").classList.toggle("on", v === "tree");
  document.getElementById("vRadial").classList.toggle("on", v === "radial");
  if (v === "radial") collapsed.clear();
  gLinks.selectAll("*").remove(); gNodes.selectAll("*").remove();
  render(true); setTimeout(() => fit(900), 60);
};
document.getElementById("vTree").onclick = () => setView("tree");
document.getElementById("vRadial").onclick = () => setView("radial");
document.getElementById("btnWho").onclick = () => welcome(true);
document.getElementById("btnDiwan").onclick = () => { storyFilter = null; openDiwan(); };
document.getElementById("btnLang").onclick = () => {
  lang = { ar: "en", en: "de", de: "ar" }[lang] || "ar";
  try { localStorage.setItem("ft-lang", lang); } catch (e) { /* storage blocked */ }
  applyLang(); render(false); if (selected) openPanel(selected);
};
document.getElementById("btnTheme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("ft-theme", root.dataset.theme); } catch (e) { /* storage blocked */ }
  render(false);
};
try { const th = localStorage.getItem("ft-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* storage blocked */ }
function updateStats() {
  if (!tree) return;
  const ids = Object.keys(tree.people);
  document.getElementById("sPeople").textContent = ids.length;
  document.getElementById("sGens").textContent = Math.max(...ids.map(genOf));
  document.getElementById("sPhotos").textContent = Object.keys(photos).filter((k) => tree.people[k]).length;
}
(function leaves() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.getElementById("leaves");
  const cols = ["#7fa34a", "#c39a3a", "#3f7a68", "#c0612b"];
  for (let i = 0; i < 9; i++) {
    const l = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    l.setAttribute("viewBox", "0 0 24 24"); l.classList.add("leaf");
    l.innerHTML = `<path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15zM5 19l9-9" fill="${cols[i % 4]}" stroke="${cols[i % 4]}" stroke-width="1.2"/>`;
    l.style.left = `${Math.random() * 100}%`; l.style.animationDuration = `${16 + Math.random() * 14}s`; l.style.animationDelay = `${-Math.random() * 20}s`;
    box.appendChild(l);
  }
})();
addEventListener("resize", () => { if (!selected) fit(0); });

/* ================= data loading ================= */
applyLang();
const loader = document.getElementById("loader");
function showEmpty() {
  loader.classList.add("done");
  openModal(`<h3>🌱 ${t("empty")}</h3><p class="sub">${isOwner ? "" : ""}</p>
    ${isOwner ? `<label class="btn primary">⬆ ${t("importJson")}<input type="file" id="oImport" accept=".json,application/json" hidden></label>` : `<button class="btn" id="eSign">${t("signIn")}</button>`}`);
  sheet.querySelector("#oImport")?.addEventListener("change", (e) => importJson(e.target.files[0]));
  sheet.querySelector("#eSign")?.addEventListener("click", () => { closeModal(); document.getElementById("btnOwner").click(); });
}
async function loadPhotos() {
  try {
    const snap = await getDocs(collection(db, "photos"));
    const next = {}; snap.forEach((d) => { next[d.id] = d.data().data; });
    if (isMember) {
      try { (await getDocs(collection(db, "photosPrivate"))).forEach((d) => { next[d.id] = d.data().data; }); } catch (e) { console.error(e); }
    }
    photos = next;
    render(false); if (selected) openPanel(selected);
  } catch (e) { console.error(e); }
}
let photosLoaded = false;
function firstRender() {
  gLinks.selectAll("*").remove(); gNodes.selectAll("*").remove();
  render(true);
  loader.classList.add("done");
  // open on the whole tree, then glide to "you"
  fit(0);
  introTimer = setTimeout(() => { if (myId() && P(myId())) focus(myId(), 0.95, 1600); }, 2300);
  const cardParam = new URLSearchParams(location.search).get("card");
  if (cardParam) { greetFocus = cardParam; setTimeout(() => openDiwan("greet"), 1500); }
  else setTimeout(() => { if (!modal.classList.contains("open")) welcome(); }, 4200);
}
let introTimer = 0;
// Local preview only: ?local=1 reads seed.json next to the page (never published).
const LOCAL = new URLSearchParams(location.search).has("local");
if (LOCAL) {
  fetch("seed.json").then((r) => r.json()).then((d) => { tree = { rootId: d.rootId, meId: d.meId, people: d.people }; firstDraw = false; firstRender(); })
    .catch((e) => { console.error(e); loader.classList.add("done"); });
} else onSnapshot(doc(db, "tree", "main"), (snap) => {
  if (!snap.exists()) { tree = null; showEmpty(); return; }
  const d = snap.data();
  const had = !!tree;
  tree = { rootId: d.rootId, meId: d.meId, people: d.people || {} };
  if (modal.classList.contains("open") && sheet.textContent.includes(t("empty"))) closeModal();
  if (!had || firstDraw) {
    firstDraw = false;
    firstRender();
  } else {
    render(false); if (selected && P(selected)) openPanel(selected); else if (selected) closePanel();
  }
  if (!photosLoaded) { photosLoaded = true; loadPhotos(); }
}, (err) => { console.error(err); loader.classList.add("done"); toast(t("err")); });

onAuthStateChanged(auth, async (u) => {
  user = u;
  isOwner = false; isAdmin = false; isMember = false; allDetails = null;
  Object.keys(detailsCache).forEach((k) => delete detailsCache[k]);
  if (u) {
    // roles are decided by the Firestore rules: owner can list admins, admins can read requests
    try { await getDocs(query(collection(db, "admins"), limit(1))); isOwner = true; } catch (e) { isOwner = false; }
    try { await getDocs(query(collection(db, "requests"), limit(1))); isAdmin = true; } catch (e) { isAdmin = false; }
    isMember = isAdmin;
    if (!isMember) { try { isMember = (await getDoc(doc(db, "members", u.uid))).exists(); } catch (e) { isMember = false; } }
  }
  rolesUid = u ? u.uid : null;
  const btn = document.getElementById("btnOwner");
  btn.innerHTML = u
    ? `<span class="me-chip">${u.photoURL ? `<img alt="" src="${esc(u.photoURL)}" referrerpolicy="no-referrer">` : "👤"}<span class="lbl">${esc((u.displayName || u.email).split(" ")[0])}</span></span>`
    : `<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.3 14.3a7.2 7.2 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"/></svg><span class="lbl">${t("signIn")}</span>`;
  btn.classList.remove("icon", "ghost");
  btn.style.color = isAdmin ? "var(--gold)" : "";
  document.getElementById("btnInbox").classList.toggle("hide", !isAdmin);
  if (isAdmin) await loadPending();
  if (tree && !LOCAL) loadPhotos();
  if (selected) openPanel(selected);
  if (!tree && modal.classList.contains("open") && sheet.textContent.includes(t("empty"))) showEmpty();
  if (isAdmin && new URLSearchParams(location.search).has("inbox")) { inbox(); history.replaceState(null, "", location.pathname); }
});
if (new URLSearchParams(location.search).has("inbox")) setTimeout(() => { if (!user) toast(t("signInForInbox")); }, 2500);
</script>
