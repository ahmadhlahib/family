<style>
:root {
  --bg: #f6efe0; --bg2: #efe4cc; --paper: #fffaf0; --ink: #2a2620; --muted: #776c5a;
  --line: #d9cbae; --green: #2f5d50; --green2: #3f7a68; --gold: #c39a3a; --gold2: #e3c26b;
  --card: #fffdf7; --shadow: 0 10px 30px rgba(60, 45, 20, .16); --danger: #b5432f;
  --glass: rgba(255, 250, 238, .82);
  --ar: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --en: "IBM Plex Sans", "Segoe UI", sans-serif;
  --disp-ar: "Reem Kufi", "IBM Plex Sans Arabic", serif;
  --disp-en: "Fraunces", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12160f; --bg2: #1a2018; --paper: #1c221b; --ink: #f1ead9; --muted: #a99f88;
    --line: #3a4436; --green: #7fbfa6; --green2: #9fd6bf; --gold: #e3c26b; --gold2: #f0d68e;
    --card: #222a21; --shadow: 0 10px 30px rgba(0, 0, 0, .45); --danger: #ef7a62;
    --glass: rgba(26, 32, 24, .85);
  }
}
:root[data-theme="dark"] {
  --bg: #12160f; --bg2: #1a2018; --paper: #1c221b; --ink: #f1ead9; --muted: #a99f88;
  --line: #3a4436; --green: #7fbfa6; --green2: #9fd6bf; --gold: #e3c26b; --gold2: #f0d68e;
  --card: #222a21; --shadow: 0 10px 30px rgba(0, 0, 0, .45); --danger: #ef7a62;
  --glass: rgba(26, 32, 24, .85);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: radial-gradient(1200px 800px at 50% 0%, var(--bg2), var(--bg) 70%);
  background-color: var(--bg);
  color: var(--ink); font-family: var(--ar); -webkit-tap-highlight-color: transparent;
}
html:not([lang="ar"]) body { font-family: var(--en); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- top bar ---------- */
.bar {
  position: fixed; inset: 12px 12px auto 12px; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(14px);
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .seal {
  width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: linear-gradient(145deg, var(--green), var(--green2)); color: var(--gold2);
  box-shadow: inset 0 0 0 2px rgba(227, 194, 107, .4);
}
.brand h1 { margin: 0; font-family: var(--disp-ar); font-size: 20px; line-height: 1.1; white-space: nowrap; }
html:not([lang="ar"]) .brand h1 { font-family: var(--disp-en); letter-spacing: .01em; }
.brand small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }
.spacer { flex: 1; }
.search { position: relative; width: min(320px, 34vw); }
.search input {
  width: 100%; padding: 9px 36px 9px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--paper); outline: none;
}
html[dir="ltr"] .search input { padding: 9px 12px 9px 36px; }
.search input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(195, 154, 58, .2); }
.search svg { position: absolute; top: 50%; transform: translateY(-50%); inset-inline-start: 11px; opacity: .55; pointer-events: none; }
html[dir="rtl"] .search svg { inset-inline-start: auto; inset-inline-end: 11px; }
.results {
  position: absolute; top: calc(100% + 6px); inset-inline: 0; max-height: 50vh; overflow: auto; display: none;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px;
}
.results.open { display: block; }
.results button { display: block; width: 100%; text-align: start; border: 0; background: none; padding: 8px 10px; border-radius: 10px; }
.results button:hover, .results button.active { background: var(--bg2); }
.results b { display: block; }
.results span { font-size: 12px; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 9px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--paper); white-space: nowrap; transition: transform .15s, background .2s;
}
.btn:hover { transform: translateY(-1px); background: var(--card); }
.btn.primary { background: linear-gradient(145deg, var(--green), var(--green2)); color: #fff; border-color: transparent; }
:root[data-theme="dark"] .btn.primary { color: #10150f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #10150f; } }
.btn.gold { background: linear-gradient(145deg, var(--gold), var(--gold2)); color: #2a2110; border-color: transparent; }
.btn.ghost { background: none; }
.btn.icon { padding: 9px; }
.btn.danger { color: var(--danger); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
.seg button { border: 0; background: none; padding: 9px 11px; }
.seg button.on { background: var(--green); color: var(--paper); }
.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--danger); color: #fff;
  font-size: 12px; display: inline-grid; place-items: center;
}
.hide { display: none !important; }

/* ---------- stats ---------- */
.stats {
  position: fixed; z-index: 10; inset-inline-start: 12px; bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap;
}
.chip {
  padding: 8px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
  backdrop-filter: blur(10px); font-size: 13px; box-shadow: var(--shadow);
}
.chip b { font-size: 15px; color: var(--green); margin-inline-end: 4px; }
.zoom { position: fixed; z-index: 10; inset-inline-end: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom .btn { width: 42px; height: 42px; justify-content: center; padding: 0; box-shadow: var(--shadow); }

/* ---------- stage ---------- */
#stage { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
#stage:active { cursor: grabbing; }
.link { fill: none; stroke-width: 2.4; stroke-linecap: round; opacity: .75; }
.link.hl { stroke-width: 4.5; opacity: 1; filter: drop-shadow(0 0 6px rgba(227, 194, 107, .7)); }
.node { cursor: pointer; }
.node .halo { fill: var(--gold2); opacity: 0; transition: opacity .25s; }
.node.hl .halo, .node.sel .halo { opacity: .45; }
.node .ring { fill: var(--card); stroke-width: 3; }
.node .initial { font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.node .name { fill: var(--ink); font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.node .gen { fill: var(--muted); font-size: 10px; text-anchor: middle; }
.node .body { transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); transform-box: fill-box; transform-origin: center; }
.node:hover .body { transform: scale(1.12); }
.node .toggle { fill: var(--paper); stroke: var(--line); }
.node .toggle-t { fill: var(--muted); font-size: 13px; text-anchor: middle; dominant-baseline: central; font-weight: 700; pointer-events: none; }
.me-tag rect { fill: var(--gold); }
.me-tag text { fill: #2a2110; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.me-pulse { fill: none; stroke: var(--gold); stroke-width: 2; animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
.gen-ring { fill: none; stroke: var(--line); stroke-dasharray: 3 7; }
.gen-label { fill: var(--muted); font-size: 12px; }

/* ---------- side panel ---------- */
.panel {
  position: fixed; z-index: 30; top: 84px; bottom: 12px; inset-inline-end: 12px; width: min(380px, calc(100% - 24px));
  background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateX(calc(100% + 24px)); transition: transform .45s cubic-bezier(.2, .9, .2, 1);
}
html[dir="rtl"] .panel { transform: translateX(calc(-100% - 24px)); }
.panel.open { transform: none !important; }
.panel .cover {
  height: 120px; flex: none; position: relative;
  background: linear-gradient(135deg, var(--branch, var(--green)), color-mix(in srgb, var(--branch, var(--green)) 55%, var(--gold2)));
}
.panel .cover::after {
  content: ""; position: absolute; inset: 0; opacity: .25;
  background-image: radial-gradient(circle at 20% 30%, #fff 0 2px, transparent 3px), radial-gradient(circle at 70% 60%, #fff 0 1.5px, transparent 2.5px);
  background-size: 60px 60px, 45px 45px;
}
.panel .close { position: absolute; top: 10px; inset-inline-end: 10px; z-index: 2; background: rgba(255, 255, 255, .85); color: #222; border: 0; }
.avatar {
  width: 112px; height: 112px; border-radius: 50%; margin: -64px auto 0; position: relative; z-index: 1;
  border: 5px solid var(--card); background: var(--branch, var(--green)); overflow: hidden; display: grid; place-items: center;
  color: #fff; font-size: 44px; font-weight: 700; box-shadow: var(--shadow);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.panel .content { padding: 12px 20px 20px; overflow: auto; text-align: center; }
.panel h2 { margin: 8px 0 2px; font-family: var(--disp-ar); font-size: 28px; }
html:not([lang="ar"]) .panel h2 { font-family: var(--disp-en); }
.panel .alt { color: var(--muted); margin: 0; }
.lineage {
  margin: 14px 0; padding: 12px 14px; border-radius: 14px; background: var(--bg); border: 1px dashed var(--line);
  font-size: 14px; line-height: 1.9; text-align: start;
}
.lineage a { color: var(--green); text-decoration: none; font-weight: 600; cursor: pointer; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 14px; }
.facts div { background: var(--bg); border-radius: 12px; padding: 8px 4px; }
.facts b { display: block; font-size: 20px; color: var(--green); }
.facts span { font-size: 12px; color: var(--muted); }
.kids { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 14px; }
.kids button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 11px; font-size: 13px; }
.note { font-size: 14px; color: var(--muted); white-space: pre-wrap; margin: 0 0 12px; }
.contact { display: grid; gap: 6px; margin: 0 0 14px; }
.contact > div { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--bg); font-size: 14px; text-align: start; }
.contact span { color: var(--muted); font-size: 12px; }
.contact b, .contact a { margin-inline-start: auto; color: var(--green); font-weight: 600; text-decoration: none; }
.contact .btn { justify-content: center; width: 100%; }
.me-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 160px; }
.me-chip img { width: 22px; height: 22px; border-radius: 50%; }
.me-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: grid; gap: 8px; }
.actions .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .btn { justify-content: center; }
.owner-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--gold2); color: #2a2110; margin-bottom: 6px; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(20, 16, 8, .45); backdrop-filter: blur(4px); padding: 16px; }
.modal.open { display: grid; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: min(520px, 100%); max-height: 90vh; overflow: auto; background: var(--card); border-radius: 22px;
  border: 1px solid var(--line); box-shadow: var(--shadow); padding: 22px; animation: pop .3s cubic-bezier(.2, 1.4, .4, 1);
}
.sheet.wide { width: min(760px, 100%); }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } }
@keyframes pop { from { transform: translateY(16px) scale(.97); opacity: 0; } }
.sheet h3 { margin: 0 0 4px; font-family: var(--disp-ar); font-size: 22px; }
html:not([lang="ar"]) .sheet h3 { font-family: var(--disp-en); }
.sheet p.sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 600; }
.field input, .field select, .field textarea {
  padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); outline: none; width: 100%;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--gold); }
.field textarea { min-height: 80px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.sheet { position: relative; }
.sheet-x { position: sticky; top: 0; float: inline-end; z-index: 5; width: 40px; height: 40px; margin: -8px -8px 0 8px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 18px; display: grid; place-items: center; box-shadow: var(--shadow); }
.sheet-x:hover { background: var(--bg2); }
.tabs button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 13px; }
.tabs button.on { background: var(--green); color: var(--paper); border-color: var(--green); }
.drop {
  border: 2px dashed var(--line); border-radius: 16px; padding: 16px; text-align: center; cursor: pointer; color: var(--muted);
  display: grid; place-items: center; gap: 8px; min-height: 120px; transition: border-color .2s, background .2s;
}
.drop:hover, .drop.over { border-color: var(--gold); background: var(--bg); }
.drop img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; box-shadow: var(--shadow); }
.foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
.req { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; background: var(--paper); }
.req .pic { width: 64px; height: 64px; border-radius: 50%; background: var(--bg2); overflow: hidden; display: grid; place-items: center; font-size: 26px; }
.req .pic img { width: 100%; height: 100%; object-fit: cover; }
.req .meta { font-size: 12px; color: var(--muted); }
.req .what { margin: 4px 0; font-size: 14px; }
.req .foot { justify-content: flex-start; margin: 6px 0 0; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.opt { border: 2px solid var(--line); border-radius: 16px; padding: 12px; text-align: center; background: var(--paper); }
.opt.on { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(195, 154, 58, .18); }
.opt b { display: block; }
.opt span { font-size: 12px; color: var(--muted); }

/* ---------- toast / loader ---------- */
.toast {
  position: fixed; z-index: 60; left: 50%; bottom: 24px; transform: translate(-50%, 140%); transition: transform .35s cubic-bezier(.2, 1.3, .4, 1);
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px);
  visibility: hidden;
}
.toast.show { transform: translate(-50%, 0); visibility: visible; }
.loader { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--bg); transition: opacity .6s; }
.loader.done { opacity: 0; pointer-events: none; }
.loader .sprout { width: 90px; height: 90px; }
.loader .sprout path { stroke: var(--green); stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 1.6s ease-in-out infinite alternate; }
.loader .sprout circle { fill: var(--gold); animation: bloom 1.6s ease-in-out infinite alternate; transform-origin: center; transform-box: fill-box; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes bloom { 0%, 40% { transform: scale(0); } 100% { transform: scale(1); } }
.loader p { color: var(--muted); text-align: center; margin: 8px 0 0; }

/* floating leaves */
.leaves { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.leaf { position: absolute; top: -40px; width: 18px; height: 18px; opacity: .35; animation: fall linear infinite; }
@keyframes fall {
  0% { transform: translate(0, -40px) rotate(0); }
  50% { transform: translate(40px, 50vh) rotate(180deg); }
  100% { transform: translate(-20px, 110vh) rotate(360deg); }
}
.confetti { position: fixed; z-index: 70; pointer-events: none; width: 9px; height: 14px; border-radius: 2px; }

/* diwan */
.private-note { display: flex; gap: 8px; align-items: flex-start; padding: 10px 14px; margin-bottom: 12px; border-radius: 14px;
  background: color-mix(in srgb, var(--gold2) 22%, var(--card)); border: 1px solid var(--gold); font-size: 13px; line-height: 1.6; }
.private-note.small { margin: 8px 0 0; font-size: 12px; }
.chat { height: min(46vh, 460px); overflow: auto; padding: 8px; border-radius: 16px; background: var(--bg); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; }
.msg.mine { align-self: flex-end; flex-direction: row-reverse; }
.msg .av { width: 34px; height: 34px; flex: none; border-radius: 50%; overflow: hidden; background: var(--green); color: #fff; display: grid; place-items: center; font-weight: 700; }
.msg .av img { width: 100%; height: 100%; object-fit: cover; }
.bubble { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px 12px; box-shadow: 0 2px 8px rgba(60, 45, 20, .06); }
.msg.mine .bubble { background: color-mix(in srgb, var(--green) 14%, var(--card)); }
.bubble .hd { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 13px; }
.bubble .who { font-size: 11px; } .bubble .who a { color: var(--green); cursor: pointer; text-decoration: none; }
.bubble .tx { white-space: pre-wrap; word-break: break-word; margin: 3px 0; }
.bubble .tm { font-size: 11px; color: var(--muted); }
.bubble .tools button { border: 0; background: none; padding: 0 3px; opacity: .6; } .bubble .tools button:hover { opacity: 1; }
.chat-compose { display: flex; gap: 8px; margin-top: 10px; align-items: stretch; }
.chat-compose textarea { flex: 1; border-radius: 14px; border: 1px solid var(--line); background: var(--paper); padding: 10px 12px; resize: none; outline: none; }
.album-add { display: grid; gap: 8px; margin-bottom: 12px; }
.album-add input { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); outline: none; width: 100%; }
.video-row { display: flex; gap: 8px; }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.tile { position: relative; aspect-ratio: 1; border: 0; padding: 0; border-radius: 14px; overflow: hidden; background: var(--bg2); }
.tile img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
.tile:hover img { transform: scale(1.06); }
.tile .vid { font-size: 40px; }
.tile .play { position: absolute; inset: 0; margin: auto; width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; }
.tile .cap { position: absolute; inset: auto 0 0 0; padding: 14px 8px 6px; font-size: 12px; color: #fff; text-align: start; background: linear-gradient(transparent, rgba(0,0,0,.65)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(10, 8, 4, .88); display: grid; place-items: center; padding: 16px; animation: fade .2s; }
.lb-inner { width: min(1000px, 100%); }
.lb-media { display: grid; place-items: center; color: #fff; min-height: 200px; }
.lb-media img { max-width: 100%; max-height: 74vh; border-radius: 14px; }
.lb-media iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 14px; background: #000; }
.lb-bar { display: flex; justify-content: space-between; gap: 10px; align-items: center; color: #fff; margin-top: 10px; flex-wrap: wrap; }
.lb-bar .btn { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.25); }
.lightbox .private-note { color: #2a2620; }
.rel-card { text-align: center; padding: 16px; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); margin-top: 10px; }
.rel-people { display: flex; align-items: center; justify-content: center; gap: 12px; }
.rel-link { font-size: 30px; animation: pulse2 1.6s ease-in-out infinite; }
@keyframes pulse2 { 50% { transform: scale(1.18); } }
.mini { display: grid; justify-items: center; gap: 4px; max-width: 170px; }
.mini .pic { width: 62px; height: 62px; border-radius: 50%; overflow: hidden; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 24px; font-weight: 700; }
.mini .pic img { width: 100%; height: 100%; object-fit: cover; }
.mini span { font-size: 12px; color: var(--muted); }
.rel-text { font-size: 18px; margin: 14px 0; } .rel-text b { color: var(--green); }
.join { padding: 4px; }
.req .pic img { width: 100%; height: 100%; object-fit: cover; }

.greet-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.greet-item { flex: none; display: flex; gap: 10px; align-items: center; text-align: start; border: 2px solid var(--line); background: var(--paper); border-radius: 16px; padding: 10px 14px; }
.greet-item.on { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(195, 154, 58, .18); }
.greet-item .ge { font-size: 28px; }
.greet-item small { display: block; color: var(--muted); font-size: 12px; }
.greet-card { margin-top: 12px; display: grid; gap: 10px; justify-items: center; }
.greet-card img { width: min(420px, 100%); border-radius: 18px; box-shadow: var(--shadow); animation: pop .4s cubic-bezier(.2, 1.4, .4, 1); }
.greet-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.greet-actions .btn { text-decoration: none; }

.stories-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
.chip-f { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; background: var(--bg2); }
.chip-f button { border: 0; background: none; }
.story { display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 14px; margin-bottom: 12px; border-radius: 18px; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(60, 45, 20, .05); }
.story-pic { width: 120px; height: 120px; border: 0; padding: 0; border-radius: 14px; overflow: hidden; background: var(--bg2); }
.story-pic img { width: 100%; height: 100%; object-fit: cover; }
.story:not(:has(.story-pic)) { grid-template-columns: 1fr; }
.story h4 { margin: 0 0 4px; font-size: 18px; color: var(--green); }
.story .meta { font-size: 12px; color: var(--muted); }
.story-text { white-space: pre-wrap; line-height: 1.8; margin: 8px 0 4px; }
.story-text.clamp { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.linkish { border: 0; background: none; color: var(--green); font-weight: 600; padding: 0; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.tag { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.tag.on { background: color-mix(in srgb, var(--gold2) 30%, var(--card)); }
.tag button { border: 0; background: none; padding: 0 2px; }
.composer { padding: 16px; margin-bottom: 14px; border-radius: 18px; border: 2px solid var(--gold); background: var(--card); }
.composer h3 { margin-top: 0; }
.rec { display: flex; gap: 10px; align-items: center; }
.story audio, .composer audio { width: 100%; margin-top: 6px; }
@media (max-width: 600px) { .story { grid-template-columns: 1fr; } .story-pic { width: 100%; height: 200px; } }

@media (prefers-reduced-motion: reduce) {
  .leaf, .me-pulse, .loader .sprout * { animation: none !important; }
  .panel, .toast { transition: none; }
}

/* ---------- small screens ---------- */
@media (max-width: 860px) {
  .modal { padding: 0; place-items: end center; }
  .sheet, .sheet.wide { width: 100%; max-height: 92vh; max-height: 92dvh; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); animation: slideUp .3s cubic-bezier(.2, .9, .2, 1); }
  .sheet-x { width: 44px; height: 44px; }
  .tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; }
  .chat { height: 48vh; height: 48dvh; }
  .lb-bar { position: sticky; bottom: 0; }
  .bar { flex-wrap: wrap; inset: 8px 8px auto 8px; padding: 8px; gap: 8px; }
  .brand small { display: none; }
  .search { order: 5; width: 100%; }
  .btn .lbl { display: none; }
  .panel { top: auto; height: 72vh; bottom: 0; inset-inline: 0; width: 100%; border-radius: 22px 22px 0 0; transform: translateY(105%) !important; }
  .panel.open { transform: none !important; }
  .stats { bottom: 8px; inset-inline-start: 8px; }
  .chip { padding: 6px 10px; font-size: 12px; }
  .zoom { bottom: 8px; inset-inline-end: 8px; }
  .two { grid-template-columns: 1fr; }
}
@media (max-width: 420px) { .brand h1 { font-size: 17px; } .chip.optional { display: none; } }

function spouseName(p, l = lang) {
  const parts = String(p?.spouse || "").split("/").map((x) => x.trim()).filter(Boolean);
  if (parts.length < 2) return parts[0] || "";
  const arPart = parts.find((x) => /[؀-ۿ]/.test(x)), laPart = parts.find((x) => !/[؀-ۿ]/.test(x));
  return (l === "ar" ? arPart || laPart : laPart || arPart) || parts[0];
}

function lineage(id, l = lang) {
  const out = [];
  let cur = id;
  while (cur && P(cur) && out.length < 40) { out.push(cur); cur = P(cur).parent; }
  return out;
}

function descCount(id) { let n = 0; const st = [...kidsOf(id)]; while (st.length) { const k = st.pop(); n++; st.push(...kidsOf(k)); } return n; }

/* branch colours: one per child of the gen-4/5 founders, chosen for contrast on cream and dark */
const PALETTE = ["#2f7d6b", "#c0612b", "#5b6fc0", "#b2457a", "#8a7a1f", "#2b8bb0", "#7d4fb5", "#c2453c", "#3f8f3a", "#a86a2b", "#4a6f8f", "#9b3f5c"];
let branchColor = {};
function computeBranches() {
  branchColor = {};
  // a "branch" = the ancestor at generation 5 (the big family houses); shallower nodes use green
  let i = 0;
  const houses = Object.keys(tree.people).filter((id) => genOf(id) === 5).sort((a, b) => (P(a).order ?? 0) - (P(b).order ?? 0));
  houses.forEach((h) => { branchColor[h] = PALETTE[i++ % PALETTE.length]; });
}
function colorOf(id) {
  const line = lineage(id);
  for (const a of line) if (branchColor[a]) return branchColor[a];
  return getComputedStyle(document.documentElement).getPropertyValue("--green").trim() || "#2f5d50";
}

const R = 26; // node radius
const measureCtx = document.createElement("canvas").getContext("2d");
function textWidth(s, size) {
  measureCtx.font = `600 ${size}px "IBM Plex Sans Arabic", "IBM Plex Sans", "Segoe UI", sans-serif`;
  return measureCtx.measureText(s).width;
}
let layout = null; // { nodes: Map id -> {x,y,angle}, root }

function hierarchy(full = false) {
  const build = (id) => {
    const kids = (!full && collapsed.has(id)) ? [] : kidsOf(id);
    return { id, children: kids.map(build), hidden: !full && collapsed.has(id) ? kidsOf(id).length : 0 };
  };
  return d3.hierarchy(build(tree.rootId));
}

function computeLayout(kind, full = false) {
  const root = hierarchy(full);
  const nodes = new Map();
  if (kind === "tree") {
    d3.tree().nodeSize([92, 170]).separation((a, b) => (a.parent === b.parent ? 1 : 1.25))(root);
    root.each((d) => nodes.set(d.data.id, { x: d.x, y: d.depth * 170, d }));
  } else {
    const leaves = root.leaves().length;
    const radius = Math.max(520, leaves * 92 / (2 * Math.PI));
    const depth = root.height || 1;
    d3.tree().size([2 * Math.PI, radius]).separation((a, b) => (a.parent === b.parent ? 1 : 1.3) / Math.max(1, a.depth))(root);
    root.each((d) => {
      const r = d.depth === 0 ? 0 : 120 + (d.y - radius / depth) * (radius - 120) / (radius - radius / depth || 1);
      const rr = d.depth === 0 ? 0 : (d.depth / depth) * radius;
      const a = d.x - Math.PI / 2;
      nodes.set(d.data.id, { x: Math.cos(a) * rr, y: Math.sin(a) * rr, angle: d.x, r: rr, d });
    });
    nodes.radius = radius; nodes.depth = depth;
  }
  return { root, nodes, kind };
}

function linkPath(kind, s, t2) {
  if (kind === "tree") {
    const my = (s.y + t2.y) / 2;
    return `M${s.x},${s.y + R}C${s.x},${my} ${t2.x},${my} ${t2.x},${t2.y - R}`;
  }
  return d3.linkRadial().angle((d) => d.angle).radius((d) => d.r)({ source: s, target: t2 });
}

function render(animate = false) {
  if (!tree) return;
  computeBranches();
  layout = computeLayout(view);
  const { nodes, root } = layout;
  const hl = new Set([...(selected ? lineage(selected) : []), ...(typeof extraHL === "undefined" ? [] : extraHL)]);

  // generation guides in circle view
  gGuides.selectAll("*").remove();
  if (view === "radial") {
    for (let i = 1; i <= nodes.depth; i++) {
      const r = (i / nodes.depth) * nodes.radius;
      gGuides.append("circle").attr("class", "gen-ring").attr("r", r);
    }
  }

  // links
  const links = root.links().map((l) => ({ id: l.target.data.id, s: nodes.get(l.source.data.id), t: nodes.get(l.target.data.id) }));
  const lk = gLinks.selectAll("path").data(links, (d) => d.id);
  lk.exit().remove();
  const lkE = lk.enter().append("path").attr("class", "link");
  lkE.merge(lk)
    .attr("d", (d) => linkPath(view, d.s, d.t))
    .attr("stroke", (d) => colorOf(d.id))
    .classed("hl", (d) => hl.has(d.id));
  if (animate) {
    lkE.merge(lk).each(function (d) {
      const len = this.getTotalLength();
      const depth = d.t.d.depth;
      d3.select(this).attr("stroke-dasharray", `${len} ${len}`).attr("stroke-dashoffset", len)
        .transition().delay(depth * 260).duration(700).ease(d3.easeCubicOut).attr("stroke-dashoffset", 0)
        .on("end", function () { d3.select(this).attr("stroke-dasharray", null); });

  }

  // nodes
  const list = [...nodes.values()];
  const nd = gNodes.selectAll("g.node").data(list, (d) => d.d.data.id);
  nd.exit().remove();
  const ne = nd.enter().append("g").attr("class", "node")
    .on("click", (e, d) => { e.stopPropagation(); select(d.d.data.id); });
  ne.append("circle").attr("class", "halo").attr("r", R + 12);
  const body = ne.append("g").attr("class", "body");
  body.append("circle").attr("class", "ring").attr("r", R).attr("filter", "url(#soft)");
  body.append("circle").attr("class", "fillc").attr("r", R - 3);
  body.append("text").attr("class", "initial");
  body.append("image").attr("class", "pic").attr("clip-path", "url(#clipC)");
  ne.append("text").attr("class", "name");
  ne.append("g").attr("class", "tg");
  ne.append("g").attr("class", "me");

  const all = ne.merge(nd);
  all.classed("hl", (d) => hl.has(d.d.data.id)).classed("sel", (d) => d.d.data.id === selected)
    .attr("transform", (d) => `translate(${d.x},${d.y})`);
  all.select(".ring").attr("stroke", (d) => colorOf(d.d.data.id)).attr("stroke-dasharray", (d) => (P(d.d.data.id)?.gender === "f" ? "5 3" : null));
  all.select(".fillc").attr("fill", (d) => colorOf(d.d.data.id));
  all.select(".initial").attr("font-size", 20).text((d) => [...nm(P(d.d.data.id))][0]);
  all.select(".pic").each(function (d) {
    const ph = photos[d.d.data.id];
    d3.select(this).attr("href", ph || null).attr("x", -(R - 3)).attr("y", -(R - 3)).attr("width", (R - 3) * 2).attr("height", (R - 3) * 2)
      .style("display", ph ? null : "none");
  });
  all.select(".name").each(function (d) {
    const el = d3.select(this);
    const p = P(d.d.data.id);
    el.text(nm(p)).attr("font-size", d.d.depth === 0 ? 20 : 15);
    if (view === "tree") {
      el.attr("transform", null).attr("x", 0).attr("y", R + 20).attr("text-anchor", "middle");
    } else {
      if (d.d.depth === 0) { el.attr("transform", null).attr("x", 0).attr("y", R + 24).attr("text-anchor", "middle"); return; }
      let deg = d.angle * 180 / Math.PI - 90;
      const flip = d.angle > Math.PI;
      const out = !d.d.children || d.d.children.length === 0;
      // inner nodes: label below node (horizontal); leaves: rotated outward
      if (out) {

          .attr("text-anchor", "middle");
      } else {
        el.attr("transform", null).attr("x", 0).attr("y", R + 18).attr("text-anchor", "middle");
      }
    }
  });
  // collapse toggles (tree view)
  all.select(".tg").each(function (d) {

    const id = d.d.data.id;
    const n = kidsOf(id).length;

    tg.append("text").text(t("you"));
  });

  if (animate) {
    ne.style("opacity", 0).attr("transform", (d) => {

      .style("opacity", 1).attr("transform", (d) => `translate(${d.x},${d.y})`);
  }
  updateStats();
}

function fit(duration = 750) {
  if (!layout) return;
  const b = gNodes.node().getBBox();
  const W = innerWidth, H = innerHeight;
  const pad = 80;
  const k = Math.min(1.2, Math.min((W - pad) / (b.width || 1), (H - 200) / (b.height || 1)));
  const tx = W / 2 - (b.x + b.width / 2) * k, ty = (H + 60) / 2 - (b.y + b.height / 2) * k;
  svg.transition().duration(duration).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
}
function focus(id, k = 1, duration = 900) {
  const n = layout?.nodes.get(id);
  if (!n) return;
  const W = innerWidth, H = innerHeight;
  const panelOpen = document.getElementById("panel").classList.contains("open") && W > 860;
  const shift = panelOpen ? (lang === "ar" ? 200 : -200) : 0;
  svg.transition().duration(duration).ease(d3.easeCubicInOut)
    .call(zoom.transform, d3.zoomIdentity.translate(W / 2 + shift - n.x * k, (W > 860 ? H / 2 : H * 0.28) + 30 - n.y * k).scale(k));
}
function expandTo(id) { lineage(id).slice(1).forEach((a) => collapsed.delete(a)); }

const modal = document.getElementById("modal"), sheet = document.getElementById("sheet");
// Popups (modal, person card, photo viewer) are "layers": each adds a history entry, so the phone's
// Back button closes the top layer instead of leaving the site.
const layers = [];
let ignorePops = 0;
const closers = {};
function pushLayer(name) {
  if (layers.includes(name)) return;
  layers.push(name);
  try { history.pushState({ ftLayer: name }, ""); } catch (e) { /* history unavailable */ }
}
function popLayer(name) {
  const i = layers.lastIndexOf(name);
  if (i < 0) return;
  layers.splice(i, 1);
  ignorePops++;
  try { history.back(); } catch (e) { ignorePops--; }
}
addEventListener("popstate", () => {
  if (ignorePops) { ignorePops--; return; }
  const name = layers.pop();
  if (name && closers[name]) closers[name]();
});
const closeBtn = `<button class="sheet-x" data-close aria-label="close" title="✕">✕</button>`;
function openModal(html, wide = false) {

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#c39a3a", "#2f7d6b", "#c0612b", "#5b6fc0", "#e3c26b", "#b2457a"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div"); c.className = "confetti";
    c.style.background = cols[i % cols.length]; c.style.left = "50%"; c.style.top = "55%";
    document.body.appendChild(c);
    const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 280;
    c.animate([
      { transform: "translate(-50%,-50%) rotate(0)", opacity: 1 },
      { transform: `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist - 120}px) rotate(${Math.random() * 720}deg)`, opacity: 1, offset: .6 },
      { transform: `translate(${Math.cos(ang) * dist * 1.1}px, ${Math.sin(ang) * dist + 200}px) rotate(${Math.random() * 900}deg)`, opacity: 0 },
    ], { duration: 1400 + Math.random() * 600, easing: "cubic-bezier(.2,.8,.3,1)" }).onfinish = () => c.remove();
  }
}

/* image -> small square JPEG data URL */
function readPhoto(file, size = 360) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith("image/")) { rej(new Error("not image")); return; }
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height);
      const c = document.createElement("canvas"); c.width = c.height = size;
      const x = c.getContext("2d");
      x.imageSmoothingQuality = "high";
      x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2 * 0.6, s, s, 0, 0, size, size);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
function wireDrop(root, onPhoto) {
  const drop = root.querySelector(".drop"), inp = root.querySelector("input[type=file]");
  drop.onclick = () => inp.click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); handle(e.dataTransfer.files[0]); };
  inp.onchange = () => handle(inp.files[0]);
  async function handle(f) {
    try { const url = await readPhoto(f); drop.innerHTML = `<img alt="" src="${url}">`; onPhoto(url); } catch (e) { toast(t("needPhoto")); }
  }
}

/* Email the owner about a new request (Web3Forms; the key only allows sending to the owner's inbox). */
const WEB3FORMS_KEY = "";
function notifyByEmail(r, id) {
  if (!WEB3FORMS_KEY) return;
  const who = (pid) => (P(pid) ? `${P(pid).ar || ""} / ${P(pid).en || ""} (${lineage(pid).slice(1, 4).map((a) => P(a).en).join(" < ")})` : "-");
  const kind = { add: "New person", edit: "Correction", photo: "New photo" }[r.type];
  const lines = [
    `${kind} request from ${r.by} <${r.byEmail}>`,
    r.type === "add" ? `Add under: ${who(id)}` : `Person: ${who(id)}`,
    r.ar || r.en ? `Name: ${r.ar || ""} / ${r.en || ""}` : "",
    r.phone ? `Phone: ${r.phone}` : "", r.wa ? `WhatsApp: ${r.wa}` : "", r.pemail ? `Email: ${r.pemail}` : "",
    r.dob ? `Date of birth: ${r.dob}` : "", r.spouse ? `Spouse: ${r.spouse}` : "",
    r.sons ? `Sons: ${r.sons}` : "", r.daughters ? `Daughters: ${r.daughters}` : "", r.info ? `About: ${r.info}` : "", r.photo ? "Photo attached (see the inbox)" : "",
    r.note ? `Message: ${r.note}` : "",
    "", `Approve or reject: ${location.origin}${location.pathname}?inbox=1`,
  ].filter(Boolean);
  fetch("https://api.web3forms.com/submit", {
    method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      access_key: WEB3FORMS_KEY, subject: `Family tree: ${kind} from ${r.by}`, from_name: "Omran Family Tree",
      replyto: r.byEmail, message: lines.join("\n"),
    }),
  }).catch((e) => console.error("email notify failed", e));
}

  sheet.onclick = async (e) => {
    const ok = e.target.closest("[data-ok]")?.dataset.ok, no = e.target.closest("[data-no]")?.dataset.no;
    const rid = ok || no;
    if (!rid) return;
    const r = pending.find((x) => x.id === rid);
    if (!r) return;
    e.target.closest("button").disabled = true;
    try {
      if (ok) {
        let focusId = r.targetId || r.parentId;
        const det = { phone: r.phone, wa: r.wa, pemail: r.pemail, dob: r.dob };
        const hasDet = Object.values(det).some(Boolean);
        if (r.type === "add" && P(r.parentId)) {
          const nid = newId();
          const rec = { ar: r.ar || "", en: r.en || "", gender: r.gender || "m", parent: r.parentId, note: r.info || "", spouse: r.spouse || "",
            order: Math.max(0, ...Object.values(tree.people).map((x) => x.order || 0)) + 1 };
          Object.keys(rec).forEach((k) => rec[k] === "" && delete rec[k]);
          await updateDoc(doc(db, "tree", "main"), { [`people.${nid}`]: rec, updatedAt: serverTimestamp() });
          if (hasDet) await saveDetails(nid, det);
          await createKids(nid, { sons: r.sons, daughters: r.daughters });
          if (r.photo) { await setDoc(photoRef(nid, r.gender), { data: r.photo }); photos[nid] = r.photo; }
          focusId = nid;
        }
        if (r.type === "edit" && P(r.targetId)) {
          const upd = { updatedAt: serverTimestamp() };
          if (r.ar) upd[`people.${r.targetId}.ar`] = r.ar;
          if (r.en) upd[`people.${r.targetId}.en`] = r.en;
          if (r.gender) upd[`people.${r.targetId}.gender`] = r.gender;
          if (r.info) upd[`people.${r.targetId}.note`] = r.info;
          if (r.spouse) upd[`people.${r.targetId}.spouse`] = r.spouse;
          await updateDoc(doc(db, "tree", "main"), upd);
          if (hasDet) {
            // merge: a correction only overwrites the fields it fills in
            delete detailsCache[r.targetId];
            const old = (await getDetails(r.targetId)) || {};
            const merged = { ...old };
            Object.entries(det).forEach(([k, v]) => { if (v) merged[k] = v; });
            await saveDetails(r.targetId, merged);
          }
          if (r.photo) { await setDoc(photoRef(r.targetId, r.gender || P(r.targetId).gender), { data: r.photo }); photos[r.targetId] = r.photo; }
        }
        if (r.type === "photo" && r.photo && P(r.targetId)) {
          await setDoc(photoRef(r.targetId), { data: r.photo }); photos[r.targetId] = r.photo;
        }
        await deleteDoc(doc(db, "requests", rid));
        toast(t("approved")); confetti();
        pending = pending.filter((x) => x.id !== rid);
        setTimeout(() => { if (focusId && P(focusId)) select(focusId); }, 600);
      } else {
        await deleteDoc(doc(db, "requests", rid));
        pending = pending.filter((x) => x.id !== rid);
        toast(t("rejected"));
      }
      const b = document.getElementById("inboxCount"); b.textContent = pending.length; b.classList.toggle("hide", !pending.length);
      sheet.querySelector(`[data-r="${rid}"]`)?.remove();
      if (!pending.length) closeModal();
    } catch (err) { console.error(err); toast(t("err")); }
  };
}

function posterSvg(kind, plang) {
  const L = computeLayout(kind, true);
  const nodes = [...L.nodes.values()];
  const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
  const pad = kind === "tree" ? 140 : 260;
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad, minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
  const header = 260, footer = 120;
  const w = Math.round(maxX - minX), h = Math.round(maxY - minY + header + footer);
  const ox = -minX, oy = -minY + header;
  const fontAr = "'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif", fontEn = "'IBM Plex Sans','Segoe UI',Arial,sans-serif";
  const font = plang === "ar" ? fontAr : fontEn;
  const nameOf = (id) => esc(nm(P(id), plang));
  let s = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="${font}">`;
  s += `<defs><clipPath id="c" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#fbf4e3"/><stop offset="1" stop-color="#efe3c8"/></radialGradient></defs>`;
  s += `<rect width="${w}" height="${h}" fill="url(#bg)"/>`;
  s += `<rect x="24" y="24" width="${w - 48}" height="${h - 48}" fill="none" stroke="#c39a3a" stroke-width="3" rx="28"/>`;
  s += `<rect x="38" y="38" width="${w - 76}" height="${h - 76}" fill="none" stroke="#c39a3a" stroke-width="1" rx="20" opacity=".6"/>`;
  s += `<text x="${w / 2}" y="140" text-anchor="middle" font-size="84" font-weight="700" fill="#2f5d50">${esc(T[plang].posterBy)}</text>`;
  s += `<text x="${w / 2}" y="200" text-anchor="middle" font-size="30" fill="#776c5a">${esc(T[plang].subtitle)} · ${Object.keys(tree.people).length} ${esc(T[plang].people)} · ${L.root.height + 1} ${esc(T[plang].generations)}</text>`;
  s += `<g transform="translate(${ox},${oy})">`;
  if (kind === "radial") for (let i = 1; i <= L.nodes.depth; i++) s += `<circle r="${(i / L.nodes.depth) * L.nodes.radius}" fill="none" stroke="#d9cbae" stroke-dasharray="3 7"/>`;
  L.root.links().forEach((l) => {
    const a = L.nodes.get(l.source.data.id), b = L.nodes.get(l.target.data.id);
    s += `<path d="${linkPath(kind, a, b)}" fill="none" stroke="${colorOf(l.target.data.id)}" stroke-width="2.6" stroke-linecap="round" opacity=".8"/>`;
  });
  nodes.forEach((n) => {
    const id = n.d.data.id, col = colorOf(id), ph = photos[id];
    s += `<g transform="translate(${n.x},${n.y})">`;
    if (id === myId()) s += `<circle r="${R + 9}" fill="#e3c26b" opacity=".55"/>`;
    s += `<circle r="${R}" fill="#fffdf7" stroke="${col}" stroke-width="3"/><circle r="${R - 3}" fill="${col}"/>`;
    if (ph) s += `<image href="${ph}" xlink:href="${ph}" x="${-(R - 3)}" y="${-(R - 3)}" width="${(R - 3) * 2}" height="${(R - 3) * 2}" clip-path="url(#c)" preserveAspectRatio="xMidYMid slice"/>`;
    else s += `<text text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="#fff">${esc([...nm(P(id), plang)][0])}</text>`;
    const fs = n.d.depth === 0 ? 22 : 15;
    if (kind === "tree" || n.d.depth === 0 || (n.d.children && n.d.children.length)) {
      s += `<text y="${R + 20}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="#2a2620" stroke="#fbf4e3" stroke-width="4" paint-order="stroke">${nameOf(id)}</text>`;
    } else {
      const deg = n.angle * 180 / Math.PI - 90, flip = n.angle > Math.PI;
      const half = textWidth(nm(P(id), plang), fs) / 2;
      s += `<text transform="rotate(${flip ? deg + 180 : deg})" x="${flip ? -(R + 8 + half) : R + 8 + half}" y="5" text-anchor="middle" font-size="${fs}" font-weight="600" fill="#2a2620">${nameOf(id)}</text>`;
    }
    s += `</g>`;
  });
  s += `</g>`;
  s += `<text x="${w / 2}" y="${h - 60}" text-anchor="middle" font-size="22" fill="#776c5a">ahmadellahib.dev/family · ${new Date().toLocaleDateString(ploc(), { year: "numeric", month: "long" })}</text>`;
  s += `</svg>`;
  return { svgText: s, w, h };
}

/* ================= welcome: "find yourself in the tree" ================= */
// Step 1: are you from the Omran family (through your father / your mother) or just visiting?
// Father side: your name + father + grandfather -> find you, or your father to add you under him.
// Mother side: your name + father + mother + mother's father -> find your mother (add you under her),
// or her father (add your mother, her husband and you in one request).
const same = (a, b) => !!a && !!b && fold(a).replace(/\s/g, "") === fold(b).replace(/\s/g, "");
// compound names ("Diab-Ali" / "دياب علي") also match on any single part, so "Diab" finds them
const nameParts = (n) => String(n || "").split(/[\s\-_]+/).filter(Boolean);
const nameMatch = (id, s) => !!P(id) && [P(id).ar, P(id).en].some((n) => same(n, s) || nameParts(n).some((part) => same(part, s)));

/* ---------- how are two people related? ---------- */
function relationTextRaw(a, b) {
  if (!P(a) || !P(b)) return "";
  if (a === b) return t("relSame");
  const la = lineage(a), lb = lineage(b);
  const lca = la.find((x) => lb.includes(x));
  if (!lca) return "";
  const da = la.indexOf(lca), db = lb.indexOf(lca);
  const bf = P(b).gender === "f", ar = lang === "ar";
  const g = (m, f) => (bf ? f : m);
  const pa = P(la[1]);
  if (da === 0) {
    if (db === 1) return ar ? g("ابنه", "ابنته") : g("his son", "his daughter");
    if (db === 2) return ar ? g("حفيده", "حفيدته") : g("his grandson", "his granddaughter");
    return ar ? `من أحفاده (بعد ${db} أجيال)` : `a descendant, ${db} generations below`;
  }
  if (db === 0) {
    if (da === 1) return ar ? g("أبوه", "أمّه") : g("his father", "his mother");
    if (da === 2) return ar ? g("جدّه", "جدّته") : g("his grandfather", "his grandmother");
    return ar ? `جدّه الأعلى (قبل ${da} أجيال)` : `an ancestor, ${da} generations up`;
  }
  const fatherSide = pa?.gender !== "f";
  if (da === 1 && db === 1) return ar ? g("أخوه", "أخته") : g("his brother", "his sister");
  if (da === 2 && db === 1) {
    return ar ? (fatherSide ? g("عمّه", "عمّته") : g("خاله", "خالته"))
      : (fatherSide ? g("his paternal uncle", "his paternal aunt") : g("his maternal uncle", "his maternal aunt"));
  }
  if (da === 1 && db === 2) {
    const sib = P(lb[1]);
    return ar ? `${g("ابن", "بنت")} ${sib?.gender === "f" ? "أخته" : "أخيه"}` : g("his nephew", "his niece");
  }
  if (da === 2 && db === 2) {
    const unc = P(lb[1]);
    const rel = fatherSide ? (unc?.gender === "f" ? "عمّته" : "عمّه") : (unc?.gender === "f" ? "خالته" : "خاله");
    return ar ? `${g("ابن", "بنت")} ${rel}` : "his first cousin";
  }
  const deg = Math.min(da, db) - 1;
  return ar ? `يجمعهما الجد ${nm(P(lca))} — ${da === db ? `أبناء عمومة من الدرجة ${deg}` : `بينهما ${Math.abs(da - db)} جيل`}`
    : `common ancestor ${nm(P(lca))} — ${da === db ? `cousins of degree ${deg}` : `${Math.abs(da - db)} generation(s) apart`}`;
}
const DE_REL = {
  "his son": "sein Sohn", "his daughter": "seine Tochter", "his grandson": "sein Enkel", "his granddaughter": "seine Enkelin",
  "his father": "sein Vater", "his mother": "seine Mutter", "his grandfather": "sein Großvater", "his grandmother": "seine Großmutter",
  "his brother": "sein Bruder", "his sister": "seine Schwester",
  "his paternal uncle": "sein Onkel väterlicherseits", "his paternal aunt": "seine Tante väterlicherseits",
  "his maternal uncle": "sein Onkel mütterlicherseits", "his maternal aunt": "seine Tante mütterlicherseits",
  "his nephew": "sein Neffe", "his niece": "seine Nichte", "his first cousin": "sein Cousin ersten Grades",
};
function relationText(a, b) {
  const r = relationTextRaw(a, b);
  if (lang !== "de") return r;
  if (DE_REL[r]) return DE_REL[r];
  if (a === b) return t("relSame");
  return r.replace(/^a descendant, (\d+) generations below$/, "ein Nachkomme, $1 Generationen darunter")
    .replace(/^an ancestor, (\d+) generations up$/, "ein Vorfahre, $1 Generationen darüber")
    .replace(/^common ancestor (.+) — cousins of degree (\d+)$/, "gemeinsamer Vorfahre $1 — Cousins $2. Grades")
    .replace(/^common ancestor (.+) — (\d+) generation\(s\) apart$/, "gemeinsamer Vorfahre $1 — $2 Generation(en) auseinander");
}

  body.innerHTML = `${privateNotice()}

async function sendJoinRequest(pid, note) {
  const data = { uid: user.uid, name: user.displayName || user.email, email: user.email, createdAt: serverTimestamp() };
  if (pid) data.personId = pid;
  if (note) data.note = note;
  if (user.photoURL) data.photo = user.photoURL.slice(0, 500);
  try {
    await setDoc(doc(db, "joinRequests", user.uid), data);
    notifyText(`Family tree: ${data.name} asks to join`, [
    `${data.name} <${data.email}> asks to join the family section.`,
    pid ? `Says they are: ${P(pid).ar || ""} / ${P(pid).en || ""} (${lineage(pid).slice(1, 4).map((a) => P(a).en).join(" < ")})` : "",
    note ? `Message: ${note}` : "",
    "", `Approve or reject: ${location.origin}${location.pathname}?inbox=1`,
    ]);
    return true;
  } catch (e) { console.error(e); toast(t("err")); return false; }
}

function upcomingBirthdays(details, days = 31) {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const out = [];
  Object.entries(details).forEach(([id, d]) => {
    if (!P(id) || !/^\d{4}-\d{2}-\d{2}$/.test(d.dob || "")) return;
    const [y, m, dd] = d.dob.split("-").map(Number);
    let next = new Date(now.getFullYear(), m - 1, dd);
    if (next < now) next = new Date(now.getFullYear() + 1, m - 1, dd);
    const inDays = Math.round((next - now) / 86400000);
    if (inDays <= days) out.push({ id, inDays, age: next.getFullYear() - y, wa: d.wa, date: next });
  });
  return out.sort((a, b) => a.inDays - b.inDays);
}

async function renderChat(body) {
  if (!(await gate(body, "chat"))) return;
  body.innerHTML = `${privateNotice()}

    <div class="chat-compose">

  body.querySelector("#chatWho")?.addEventListener("click", (e) => { e.preventDefault(); welcome(true); });
  const send = async () => {
    const ta = body.querySelector("#chatText"); const text = ta.value.trim();

    const btn = body.querySelector("#chatSend"); btn.disabled = true;
    try {
      const msg = { text, uid: user.uid, name: user.displayName || user.email, createdAt: serverTimestamp() };

      ta.value = "";

    btn.disabled = false; ta.focus();
  };
  body.querySelector("#chatSend").onclick = send;
  body.querySelector("#chatText").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  chatUnsub = onSnapshot(query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(150)), (snap) => {
    chatMsgs = snap.docs.map((d) => ({ id: d.id, ...d.data() })).reverse();
    drawChat();
  }, (e) => { console.error(e); const l = document.getElementById("chatList"); if (l) l.innerHTML = `<div class="empty">${t("err")}</div>`; });
}
function drawChat() {
  const list = document.getElementById("chatList");
  if (!list) return;
  const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
  list.innerHTML = chatMsgs.length ? chatMsgs.map((m) => {
    const mine = m.uid === user?.uid;
    const when = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleString(loc(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
    const who = m.personId && P(m.personId) ? `<a data-go="${m.personId}">${esc(lineText(m.personId, 3))}</a>` : "";
    const tools = (isAdmin || mine) ? `<span class="tools">${isAdmin ? `<button data-edit="${m.id}" title="${t("edit")}">✎</button>` : ""}<button data-delm="${m.id}" title="${t("del")}">🗑</button></span>` : "";
    return `<div class="msg ${mine ? "mine" : ""}" data-m="${m.id}">
      <div class="av">${m.photo ? `<img alt="" src="${esc(m.photo)}" referrerpolicy="no-referrer">` : esc([...(m.name || "?")][0])}</div>
      <div class="bubble"><div class="hd"><b>${esc(m.name)}</b>${tools}</div>${who ? `<div class="who">${who}</div>` : ""}
      <div class="tx" dir="auto">${esc(m.text)}</div><div class="tm">${when}${m.edited ? " · " + t("edited") : ""}</div></div></div>`;
  }).join("") : `<div class="empty">${t("chatEmpty")}</div>`;
  if (atBottom || !list.dataset.init) { list.scrollTop = list.scrollHeight; list.dataset.init = "1"; }
  list.onclick = async (e) => {
    const go = e.target.closest("[data-go]")?.dataset.go;
    if (go) { closeModal(); select(go); return; }
    const del = e.target.closest("[data-delm]")?.dataset.delm;
    if (del) { try { await deleteDoc(doc(db, "messages", del)); toast(t("deleted")); } catch (er) { console.error(er); toast(t("err")); } return; }
    const ed = e.target.closest("[data-edit]")?.dataset.edit;
    if (ed) {
      const m = chatMsgs.find((x) => x.id === ed); const box = list.querySelector(`[data-m="${ed}"] .tx`);
      if (!m || !box) return;
      box.innerHTML = `<textarea maxlength="1000" rows="3" style="width:100%">${esc(m.text)}</textarea><div class="foot" style="margin:4px 0 0"><button class="btn" data-x>${t("cancel")}</button><button class="btn primary" data-s>${t("save")}</button></div>`;
      box.querySelector("[data-x]").onclick = drawChat;

/* ---------- album: photos (stored compressed) and video links ---------- */
function resizeImage(file, max, quality) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith("image/")) { rej(new Error("not image")); return; }
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext("2d"); x.imageSmoothingQuality = "high"; x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}
async function albumPhoto(file) {
  // full image must fit one Firestore document (< ~1 MB as text)
  for (const [max, q] of [[1600, 0.82], [1400, 0.75], [1100, 0.7], [900, 0.65]]) {
    const full = await resizeImage(file, max, q);
    if (full.length < 900000) return { full, thumb: await resizeImage(file, 420, 0.72) };
  }
  throw new Error("too big");
}
function videoEmbed(url) {
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/);
  if (yt) return { kind: "youtube", src: `https://www.youtube-nocookie.com/embed/${yt[1]}`, thumb: `https://i.ytimg.com/vi/${yt[1]}/hqdefault.jpg` };
  const gd = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (gd) return { kind: "drive", src: `https://drive.google.com/file/d/${gd[1]}/preview`, thumb: null };
  return null;
}

async function openMedia(id) {
  const g = galleryItems.find((x) => x.id === id); if (!g) return;
  const lb = document.createElement("div"); lb.className = "lightbox";
  const canDel = isAdmin || g.uid === user?.uid;
  const when = g.createdAt?.toDate ? g.createdAt.toDate().toLocaleDateString(loc()) : "";
  lb.innerHTML = `<div class="lb-inner"><div class="lb-media">⏳</div>
    <div class="lb-bar"><span><b>${esc(g.name)}</b> · ${when}${g.caption ? " · " + esc(g.caption) : ""}</span>
    <span>${canDel ? `<button class="btn danger" data-del>🗑 ${t("del")}</button>` : ""}<button class="btn" data-x>✕</button></span></div>
    <div class="private-note small">🔒 ${t("privateNoticeShort")}</div></div>`;
  document.body.appendChild(lb);
  pushLayer("lightbox");
  closers.lightbox = () => lb.remove();
  const close = () => { lb.remove(); popLayer("lightbox"); };
  lb.onclick = (e) => { if (e.target === lb || e.target.closest("[data-x]")) close(); };
  lb.querySelector("[data-del]")?.addEventListener("click", async () => {
    try { if (g.type === "photo") await deleteDoc(doc(db, "galleryFull", id)); await deleteDoc(doc(db, "gallery", id)); close(); toast(t("deleted")); } catch (er) { console.error(er); toast(t("err")); }
  });
  const box = lb.querySelector(".lb-media");
  if (g.type === "photo") {
    try { const s = await getDoc(doc(db, "galleryFull", id)); box.innerHTML = `<img alt="" src="${esc(s.data()?.data || g.thumb)}">`; } catch (er) { box.innerHTML = `<img alt="" src="${esc(g.thumb)}">`; }
  } else {
    const v = videoEmbed(g.url);
    box.innerHTML = v ? `<iframe src="${esc(v.src)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>` : `<a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.url)}</a>`;
  }
}

  };
}

    msg: "بمناسبة ذكرى المولد النبوي الشريف 💚 اللهم صلِّ وسلّم على سيدنا محمد، وكل عام وأنتم بخير." },
  mother: { emoji: "🌷", ar: "عيد الأم", en: "Mother's Day", verse: ["وَقُل رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا", "الإسراء", 24],
    msg: "إلى كل أمّ في عائلة آل عمران 🌷 أنتنّ جذور هذه الشجرة وظلّها. كل عام وأنتنّ بخير، والرحمة لأمهاتنا اللواتي رحلن." },
  birthday: { emoji: "🎂", ar: "عيد ميلاد سعيد", en: "Happy Birthday", verse: ["وَالسَّلَامُ عَلَيَّ يَوْمَ وُلِدتُّ", "مريم", 33] },
};
const dayMs = 86400000;
const atNoon = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12);
function nextFriday(from = new Date()) { const d = atNoon(from); d.setDate(d.getDate() + ((5 - d.getDay() + 7) % 7)); return d; }
function weekIndex(d) { return Math.floor((atNoon(d) - new Date(2026, 0, 2, 12)) / (7 * dayMs)); }
function fridayContent(d = nextFriday()) {
  const i = ((weekIndex(d) % VERSES.length) + VERSES.length) % VERSES.length;
  const j = ((weekIndex(d) % FRIDAY_MSGS.length) + FRIDAY_MSGS.length) % FRIDAY_MSGS.length;
  return { key: "friday", date: d, title: OCC.friday.ar, emoji: OCC.friday.emoji, verse: VERSES[i], msg: FRIDAY_MSGS[j] };
}
function upcomingOccasions(days = 380) {
  const out = [];
  let fmt = null;
  try { fmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", { day: "numeric", month: "numeric" }); } catch (e) { fmt = null; }
  const start = atNoon(new Date());
  for (let i = 0; i <= days; i++) {
    const d = new Date(start.getTime() + i * dayMs);
    if (fmt) {
      const parts = fmt.formatToParts(d);
      const key = `${parts.find((p) => p.type === "month")?.value}-${parts.find((p) => p.type === "day")?.value}`;
      if (HIJRI_OCCASIONS[key]) out.push({ key: HIJRI_OCCASIONS[key], date: d });
    }
    if (d.getMonth() === 2 && d.getDate() === 21) out.push({ key: "mother", date: d }); // Lebanon
  }
  return out.map((o) => ({ ...o, title: OCC[o.key].ar, emoji: OCC[o.key].emoji, verse: OCC[o.key].verse, msg: OCC[o.key].msg }));
}
function birthdayContent(x) {
  const n = nm(P(x.id), "ar");
  return { key: "bday", id: x.id, date: x.date, title: `${OCC.birthday.ar}`, emoji: "🎂", verse: OCC.birthday.verse,
    msg: `كل عام وأنت بخير يا ${n} 🎂 الله يطوّل بعمرك ويسعدك ويحقق كل أمنياتك. من كل عائلة آل عمران مع المحبة 🌳`, name: n, wa: x.wa };
}
const greetingText = (c) => `${c.emoji} ${c.title}${c.name ? " يا " + c.name : ""}\n\n﴿${c.verse[0]}﴾\n[${c.verse[1]}: ${c.verse[2]}]\n\n${c.msg}\n\n🌳 شجرة آل عمران\n${location.origin}${location.pathname}`;

/* ---- the card image (1080x1350, good for WhatsApp Status and Facebook) ---- */
function wrapLines(ctx, text, maxW) {
  const words = text.split(/\s+/); const lines = []; let line = "";
  words.forEach((w) => { const tst = line ? line + " " + w : w; if (ctx.measureText(tst).width > maxW && line) { lines.push(line); line = w; } else line = tst; });
  if (line) lines.push(line);
  return lines;
}
async function drawCard(c) {
  const W = 1080, H = 1350;
  try { await Promise.all(["700 80px 'Reem Kufi'", "700 56px Amiri", "600 34px 'IBM Plex Sans Arabic'"].map((f) => document.fonts.load(f))); } catch (e) { /* fonts optional */ }
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  const g = x.createRadialGradient(W / 2, 0, 100, W / 2, H / 2, H);
  g.addColorStop(0, "#fbf4e3"); g.addColorStop(.6, "#f0e3c4"); g.addColorStop(1, "#dcc690");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // soft pattern of dots
  x.fillStyle = "rgba(195,154,58,.12)";
  for (let i = 0; i < 160; i++) { x.beginPath(); x.arc((i * 137) % W, (i * 271) % H, 2 + (i % 3), 0, Math.PI * 2); x.fill(); }
  // frames
  const rr = (px, py, w, h, r) => { x.beginPath(); x.roundRect(px, py, w, h, r); };
  x.strokeStyle = "#c39a3a"; x.lineWidth = 6; rr(28, 28, W - 56, H - 56, 40); x.stroke();
  x.lineWidth = 2; x.globalAlpha = .6; rr(48, 48, W - 96, H - 96, 30); x.stroke(); x.globalAlpha = 1;
  x.textAlign = "center"; x.direction = "rtl";
  // emoji on a medallion
  x.fillStyle = "#2f5d50"; x.beginPath(); x.arc(W / 2, 175, 86, 0, Math.PI * 2); x.fill();
  x.strokeStyle = "#e3c26b"; x.lineWidth = 6; x.stroke();
  x.font = "92px 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif"; x.textBaseline = "middle";
  x.fillText(c.emoji, W / 2, 182); x.textBaseline = "alphabetic";
  // title (+ name for birthdays)
  x.fillStyle = "#2f5d50"; x.font = "700 104px 'Reem Kufi', 'IBM Plex Sans Arabic', serif";
  x.fillText(c.title, W / 2, 380);
  let headBottom = 410;
  if (c.name) { x.font = "700 72px 'Reem Kufi', serif"; x.fillStyle = "#8a6a1f"; x.fillText(c.name, W / 2, 475); headBottom = 505; }
  // measure verse + message, then centre them between the title and the footer
  x.font = "700 72px Amiri, 'Traditional Arabic', serif";
  const vLines = wrapLines(x, `﴿ ${c.verse[0]} ﴾`, W - 280);
  const vh = vLines.length * 112 + 120;
  x.font = "600 46px 'IBM Plex Sans Arabic', sans-serif";
  const mLines = wrapLines(x, c.msg, W - 230).slice(0, 7);
  const mh = mLines.length * 72;
  const footerTop = H - 190;
  const top = headBottom + Math.max(30, (footerTop - headBottom - (vh + 70 + mh)) / 2);
  x.fillStyle = "rgba(255,253,247,.88)"; rr(110, top, W - 220, vh, 34); x.fill();
  x.strokeStyle = "#e3c26b"; x.lineWidth = 3; x.stroke();
  x.fillStyle = "#2a2620"; x.font = "700 72px Amiri, 'Traditional Arabic', serif";
  vLines.forEach((l, i) => x.fillText(l, W / 2, top + 100 + i * 112));
  x.font = "600 32px 'IBM Plex Sans Arabic', sans-serif"; x.fillStyle = "#8a6a1f";
  x.fillText(`سورة ${c.verse[1]} · ${c.verse[2]}`, W / 2, top + vh - 30);
  // message
  x.font = "600 46px 'IBM Plex Sans Arabic', sans-serif"; x.fillStyle = "#2f5d50";
  mLines.forEach((l, i) => x.fillText(l, W / 2, top + vh + 100 + i * 72));
  // footer
  x.fillStyle = "#2f5d50"; rr(W / 2 - 300, H - 170, 600, 84, 42); x.fill();
  x.fillStyle = "#f0d68e"; x.font = "700 36px 'Reem Kufi', sans-serif"; x.fillText("🌳 شجرة آل عمران", W / 2, H - 116);
  x.fillStyle = "#776c5a"; x.font = "500 26px 'IBM Plex Sans', sans-serif"; x.direction = "ltr";
  x.fillText("ahmadellahib.dev/family", W / 2, H - 50);
  return cv;
}

      </div><p class="sub">${t("statusTip")}</p></div>`;
    const blob = await new Promise((r) => cv.toBlob(r, "image/jpeg", .92));

      if (c.key === "bday") { const d = allDetails?.[c.id]; emails.clear(); if (d?.pemail) emails.add(d.pemail); }

/* ================= stories & memories (members only) ================= */
// stories/{id}: title, text, personIds[], era, thumb, hasPhoto, hasAudio, uid, name, photo, createdAt
// storyMedia/{id}: photo (full jpeg) and/or audio (voice note) as data URLs
let storyFilter = null;
let storiesUnsub = null;
let stories = [];

function pickAudioType() {
  const types = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4", "audio/webm"];
  return types.find((x) => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x)) || "";
}
const blobToDataUrl = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });

async function renderStories(body) {
  if (storiesUnsub) { storiesUnsub(); storiesUnsub = null; }
  if (!(await gate(body, "stories"))) return;
  body.innerHTML = `${privateNotice()}
    <div class="stories-head">
      ${storyFilter && P(storyFilter) ? `<span class="chip-f">📖 ${t("storiesAbout")} <b>${esc(nm(P(storyFilter)))}</b> <button data-clearf>✕</button></span>` : `<span class="sub">${t("storiesSub")}</span>`}
      <button class="btn gold" id="stNew">✍️ ${t("writeMemory")}</button>
    </div>
    <div id="stList"><div class="empty">…</div></div>`;
  body.querySelector("[data-clearf]")?.addEventListener("click", () => { storyFilter = null; renderStories(body); });
  body.querySelector("#stNew").onclick = () => storyComposer(body);
  storiesUnsub = onSnapshot(query(collection(db, "stories"), orderBy("createdAt", "desc"), limit(200)), (snap) => {

    drawStories(body);
