<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root {
  --bg: #f6efe0; --bg2: #efe4cc; --paper: #fffaf0; --ink: #2a2620; --muted: #776c5a;
  --line: #d9cbae; --green: #2f5d50; --green2: #3f7a68; --gold: #c39a3a; --gold2: #e3c26b;
  --card: #fffdf7; --shadow: 0 10px 30px rgba(60, 45, 20, .16); --danger: #b5432f;
  --glass: rgba(255, 250, 238, .82);
  --ar: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --en: "IBM Plex Sans", "Segoe UI", sans-serif;
  --disp-ar: "Reem Kufi", "IBM Plex Sans Arabic", serif;
  --disp-en: "Fraunces", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12160f; --bg2: #1a2018; --paper: #1c221b; --ink: #f1ead9; --muted: #a99f88;
    --line: #3a4436; --green: #7fbfa6; --green2: #9fd6bf; --gold: #e3c26b; --gold2: #f0d68e;
    --card: #222a21; --shadow: 0 10px 30px rgba(0, 0, 0, .45); --danger: #ef7a62;
    --glass: rgba(26, 32, 24, .85);
  }
}
:root[data-theme="dark"] {
  --bg: #12160f; --bg2: #1a2018; --paper: #1c221b; --ink: #f1ead9; --muted: #a99f88;
  --line: #3a4436; --green: #7fbfa6; --green2: #9fd6bf; --gold: #e3c26b; --gold2: #f0d68e;
  --card: #222a21; --shadow: 0 10px 30px rgba(0, 0, 0, .45); --danger: #ef7a62;
  --glass: rgba(26, 32, 24, .85);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: radial-gradient(1200px 800px at 50% 0%, var(--bg2), var(--bg) 70%);
  background-color: var(--bg);
  color: var(--ink); font-family: var(--ar); -webkit-tap-highlight-color: transparent;
}
html[lang="en"] body { font-family: var(--en); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- top bar ---------- */
.bar {
  position: fixed; inset: 12px 12px auto 12px; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 18px; background: var(--glass); backdrop-filter: blur(14px);
  border: 1px solid var(--line); box-shadow: var(--shadow);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .seal {
  width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: linear-gradient(145deg, var(--green), var(--green2)); color: var(--gold2);
  box-shadow: inset 0 0 0 2px rgba(227, 194, 107, .4);
}
.brand h1 { margin: 0; font-family: var(--disp-ar); font-size: 20px; line-height: 1.1; white-space: nowrap; }
html[lang="en"] .brand h1 { font-family: var(--disp-en); letter-spacing: .01em; }
.brand small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; }
.spacer { flex: 1; }
.search { position: relative; width: min(320px, 34vw); }
.search input {
  width: 100%; padding: 9px 36px 9px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--paper); outline: none;
}
html[dir="ltr"] .search input { padding: 9px 12px 9px 36px; }
.search input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(195, 154, 58, .2); }
.search svg { position: absolute; top: 50%; transform: translateY(-50%); inset-inline-start: 11px; opacity: .55; pointer-events: none; }
html[dir="rtl"] .search svg { inset-inline-start: auto; inset-inline-end: 11px; }
.results {
  position: absolute; top: calc(100% + 6px); inset-inline: 0; max-height: 50vh; overflow: auto; display: none;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 6px;
}
.results.open { display: block; }
.results button { display: block; width: 100%; text-align: start; border: 0; background: none; padding: 8px 10px; border-radius: 10px; }
.results button:hover, .results button.active { background: var(--bg2); }
.results b { display: block; }
.results span { font-size: 12px; color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 9px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--paper); white-space: nowrap; transition: transform .15s, background .2s;
}
.btn:hover { transform: translateY(-1px); background: var(--card); }
.btn.primary { background: linear-gradient(145deg, var(--green), var(--green2)); color: #fff; border-color: transparent; }
:root[data-theme="dark"] .btn.primary { color: #10150f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #10150f; } }
.btn.gold { background: linear-gradient(145deg, var(--gold), var(--gold2)); color: #2a2110; border-color: transparent; }
.btn.ghost { background: none; }
.btn.icon { padding: 9px; }
.btn.danger { color: var(--danger); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--paper); }
.seg button { border: 0; background: none; padding: 9px 11px; }
.seg button.on { background: var(--green); color: var(--paper); }
.badge {
  min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--danger); color: #fff;
  font-size: 12px; display: inline-grid; place-items: center;
}
.hide { display: none !important; }

/* ---------- stats ---------- */
.stats {
  position: fixed; z-index: 10; inset-inline-start: 12px; bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap;
}
.chip {
  padding: 8px 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line);
  backdrop-filter: blur(10px); font-size: 13px; box-shadow: var(--shadow);
}
.chip b { font-size: 15px; color: var(--green); margin-inline-end: 4px; }
.zoom { position: fixed; z-index: 10; inset-inline-end: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom .btn { width: 42px; height: 42px; justify-content: center; padding: 0; box-shadow: var(--shadow); }

/* ---------- stage ---------- */
#stage { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
#stage:active { cursor: grabbing; }
.link { fill: none; stroke-width: 2.4; stroke-linecap: round; opacity: .75; }
.link.hl { stroke-width: 4.5; opacity: 1; filter: drop-shadow(0 0 6px rgba(227, 194, 107, .7)); }
.node { cursor: pointer; }
.node .halo { fill: var(--gold2); opacity: 0; transition: opacity .25s; }
.node.hl .halo, .node.sel .halo { opacity: .45; }
.node .ring { fill: var(--card); stroke-width: 3; }
.node .initial { font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.node .name { fill: var(--ink); font-weight: 600; text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.node .gen { fill: var(--muted); font-size: 10px; text-anchor: middle; }
.node .body { transition: transform .2s cubic-bezier(.3, 1.6, .5, 1); transform-box: fill-box; transform-origin: center; }
.node:hover .body { transform: scale(1.12); }
.node .toggle { fill: var(--paper); stroke: var(--line); }
.node .toggle-t { fill: var(--muted); font-size: 13px; text-anchor: middle; dominant-baseline: central; font-weight: 700; pointer-events: none; }
.me-tag rect { fill: var(--gold); }
.me-tag text { fill: #2a2110; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.me-pulse { fill: none; stroke: var(--gold); stroke-width: 2; animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
.gen-ring { fill: none; stroke: var(--line); stroke-dasharray: 3 7; }
.gen-label { fill: var(--muted); font-size: 12px; }

/* ---------- side panel ---------- */
.panel {
  position: fixed; z-index: 30; top: 84px; bottom: 12px; inset-inline-end: 12px; width: min(380px, calc(100% - 24px));
  background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateX(calc(100% + 24px)); transition: transform .45s cubic-bezier(.2, .9, .2, 1);
}
html[dir="rtl"] .panel { transform: translateX(calc(-100% - 24px)); }
.panel.open { transform: none !important; }
.panel .cover {
  height: 120px; flex: none; position: relative;
  background: linear-gradient(135deg, var(--branch, var(--green)), color-mix(in srgb, var(--branch, var(--green)) 55%, var(--gold2)));
}
.panel .cover::after {
  content: ""; position: absolute; inset: 0; opacity: .25;
  background-image: radial-gradient(circle at 20% 30%, #fff 0 2px, transparent 3px), radial-gradient(circle at 70% 60%, #fff 0 1.5px, transparent 2.5px);
  background-size: 60px 60px, 45px 45px;
}
.panel .close { position: absolute; top: 10px; inset-inline-end: 10px; z-index: 2; background: rgba(255, 255, 255, .85); color: #222; border: 0; }
.avatar {
  width: 112px; height: 112px; border-radius: 50%; margin: -64px auto 0; position: relative; z-index: 1;
  border: 5px solid var(--card); background: var(--branch, var(--green)); overflow: hidden; display: grid; place-items: center;
  color: #fff; font-size: 44px; font-weight: 700; box-shadow: var(--shadow);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.panel .content { padding: 12px 20px 20px; overflow: auto; text-align: center; }
.panel h2 { margin: 8px 0 2px; font-family: var(--disp-ar); font-size: 28px; }
html[lang="en"] .panel h2 { font-family: var(--disp-en); }
.panel .alt { color: var(--muted); margin: 0; }
.lineage {
  margin: 14px 0; padding: 12px 14px; border-radius: 14px; background: var(--bg); border: 1px dashed var(--line);
  font-size: 14px; line-height: 1.9; text-align: start;
}
.lineage a { color: var(--green); text-decoration: none; font-weight: 600; cursor: pointer; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 14px; }
.facts div { background: var(--bg); border-radius: 12px; padding: 8px 4px; }
.facts b { display: block; font-size: 20px; color: var(--green); }
.facts span { font-size: 12px; color: var(--muted); }
.kids { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 14px; }
.kids button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 11px; font-size: 13px; }
.note { font-size: 14px; color: var(--muted); white-space: pre-wrap; margin: 0 0 12px; }
.actions { display: grid; gap: 8px; }
.actions .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions .btn { justify-content: center; }
.owner-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--gold2); color: #2a2110; margin-bottom: 6px; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(20, 16, 8, .45); backdrop-filter: blur(4px); padding: 16px; }
.modal.open { display: grid; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: min(520px, 100%); max-height: 90vh; overflow: auto; background: var(--card); border-radius: 22px;
  border: 1px solid var(--line); box-shadow: var(--shadow); padding: 22px; animation: pop .3s cubic-bezier(.2, 1.4, .4, 1);
}
.sheet.wide { width: min(760px, 100%); }
@keyframes pop { from { transform: translateY(16px) scale(.97); opacity: 0; } }
.sheet h3 { margin: 0 0 4px; font-family: var(--disp-ar); font-size: 22px; }
html[lang="en"] .sheet h3 { font-family: var(--disp-en); }
.sheet p.sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 13px; font-weight: 600; }
.field input, .field select, .field textarea {
  padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); outline: none; width: 100%;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--gold); }
.field textarea { min-height: 80px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 13px; }
.tabs button.on { background: var(--green); color: var(--paper); border-color: var(--green); }
.drop {
  border: 2px dashed var(--line); border-radius: 16px; padding: 16px; text-align: center; cursor: pointer; color: var(--muted);
  display: grid; place-items: center; gap: 8px; min-height: 120px; transition: border-color .2s, background .2s;
}
.drop:hover, .drop.over { border-color: var(--gold); background: var(--bg); }
.drop img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; box-shadow: var(--shadow); }
.foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
.req { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; background: var(--paper); }
.req .pic { width: 64px; height: 64px; border-radius: 50%; background: var(--bg2); overflow: hidden; display: grid; place-items: center; font-size: 26px; }
.req .pic img { width: 100%; height: 100%; object-fit: cover; }
.req .meta { font-size: 12px; color: var(--muted); }
.req .what { margin: 4px 0; font-size: 14px; }
.req .foot { justify-content: flex-start; margin: 6px 0 0; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.opt { border: 2px solid var(--line); border-radius: 16px; padding: 12px; text-align: center; background: var(--paper); }
.opt.on { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(195, 154, 58, .18); }
.opt b { display: block; }
.opt span { font-size: 12px; color: var(--muted); }

/* ---------- toast / loader ---------- */
.toast {
  position: fixed; z-index: 60; left: 50%; bottom: 24px; transform: translate(-50%, 140%); transition: transform .35s cubic-bezier(.2, 1.3, .4, 1);
  background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px);
  visibility: hidden;
}
.toast.show { transform: translate(-50%, 0); visibility: visible; }
.loader { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--bg); transition: opacity .6s; }
.loader.done { opacity: 0; pointer-events: none; }
.loader .sprout { width: 90px; height: 90px; }
.loader .sprout path { stroke: var(--green); stroke-width: 4; fill: none; stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw 1.6s ease-in-out infinite alternate; }
.loader .sprout circle { fill: var(--gold); animation: bloom 1.6s ease-in-out infinite alternate; transform-origin: center; transform-box: fill-box; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes bloom { 0%, 40% { transform: scale(0); } 100% { transform: scale(1); } }
.loader p { color: var(--muted); text-align: center; margin: 8px 0 0; }

/* floating leaves */
.leaves { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.leaf { position: absolute; top: -40px; width: 18px; height: 18px; opacity: .35; animation: fall linear infinite; }
@keyframes fall {
  0% { transform: translate(0, -40px) rotate(0); }
  50% { transform: translate(40px, 50vh) rotate(180deg); }
  100% { transform: translate(-20px, 110vh) rotate(360deg); }
}
.confetti { position: fixed; z-index: 70; pointer-events: none; width: 9px; height: 14px; border-radius: 2px; }

@media (prefers-reduced-motion: reduce) {
  .leaf, .me-pulse, .loader .sprout * { animation: none !important; }
  .panel, .toast { transition: none; }
}

/* ---------- small screens ---------- */
@media (max-width: 860px) {
  .bar { flex-wrap: wrap; inset: 8px 8px auto 8px; padding: 8px; gap: 8px; }
  .brand small { display: none; }
  .search { order: 5; width: 100%; }
  .btn .lbl { display: none; }
  .panel { top: auto; height: 72vh; bottom: 0; inset-inline: 0; width: 100%; border-radius: 22px 22px 0 0; transform: translateY(105%) !important; }
  .panel.open { transform: none !important; }
  .stats { bottom: 8px; inset-inline-start: 8px; }
  .chip { padding: 6px 10px; font-size: 12px; }
  .zoom { bottom: 8px; inset-inline-end: 8px; }
  .two { grid-template-columns: 1fr; }
}
@media (max-width: 420px) { .brand h1 { font-size: 17px; } .chip.optional { display: none; } }
</style>
</head>
<body>
<div class="leaves" id="leaves" aria-hidden="true"></div>
<svg id="stage" role="img" aria-label="Family tree"></svg>

<header class="bar">
  <div class="brand">
    <div class="seal" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21v-8M12 15l-4-3M12 13l4-4"/><circle cx="7" cy="10" r="2.5" fill="currentColor"/><circle cx="17" cy="8" r="2.5" fill="currentColor"/><circle cx="12" cy="6" r="2.2" fill="currentColor"/></svg>
    </div>
    <div>
      <h1 data-t="title"></h1>
      <small data-t="subtitle"></small>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" data-ph="search">
    <div class="results" id="results"></div>
  </div>
  <div class="seg" role="group">
    <button id="vTree" class="on" data-t="viewTree"></button>
    <button id="vRadial" data-t="viewCircle"></button>
  </div>
  <button class="btn" id="btnPoster"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 15l3-3 2 2 3-4"/></svg><span class="lbl" data-t="poster"></span></button>
  <button class="btn" id="btnLang">EN</button>
  <button class="btn icon" id="btnTheme" aria-label="theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button class="btn hide" id="btnInbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg><span class="lbl" data-t="requests"></span><span class="badge hide" id="inboxCount">0</span></button>
  <button class="btn icon ghost" id="btnOwner" aria-label="owner"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2M17 6l3 3M14 9l2 2"/></svg></button>
</header>

<div class="stats">
  <div class="chip"><b id="sPeople">0</b><span data-t="people"></span></div>
  <div class="chip"><b id="sGens">0</b><span data-t="generations"></span></div>
  <div class="chip optional"><b id="sPhotos">0</b><span data-t="photos"></span></div>
</div>
<div class="zoom">
  <button class="btn" id="zIn" aria-label="zoom in">+</button>
  <button class="btn" id="zOut" aria-label="zoom out">−</button>
  <button class="btn" id="zFit" aria-label="fit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button class="btn" id="zMe" aria-label="me"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>

<aside class="panel" id="panel" aria-live="polite">
  <div class="cover"><button class="btn icon close" id="pClose" aria-label="close">✕</button></div>
  <div class="avatar" id="pAvatar"></div>
  <div class="content">
    <div id="pOwnerTag" class="owner-tag hide" data-t="youAreOwner"></div>
    <h2 id="pName"></h2>
    <p class="alt" id="pAlt"></p>

function lineage(id, l = lang) {
  const out = [];
  let cur = id;
  while (cur && P(cur) && out.length < 40) { out.push(cur); cur = P(cur).parent; }
  return out;
}
function genOf(id) { return lineage(id).length; }
function descCount(id) { let n = 0; const st = [...kidsOf(id)]; while (st.length) { const k = st.pop(); n++; st.push(...kidsOf(k)); } return n; }

/* branch colours: one per child of the gen-4/5 founders, chosen for contrast on cream and dark */
const PALETTE = ["#2f7d6b", "#c0612b", "#5b6fc0", "#b2457a", "#8a7a1f", "#2b8bb0", "#7d4fb5", "#c2453c", "#3f8f3a", "#a86a2b", "#4a6f8f", "#9b3f5c"];
let branchColor = {};
function computeBranches() {
  branchColor = {};
  // a "branch" = the ancestor at generation 5 (the big family houses); shallower nodes use green
  let i = 0;
  const houses = Object.keys(tree.people).filter((id) => genOf(id) === 5).sort((a, b) => (P(a).order ?? 0) - (P(b).order ?? 0));
  houses.forEach((h) => { branchColor[h] = PALETTE[i++ % PALETTE.length]; });
}
function colorOf(id) {
  const line = lineage(id);
  for (const a of line) if (branchColor[a]) return branchColor[a];
  return getComputedStyle(document.documentElement).getPropertyValue("--green").trim() || "#2f5d50";
}

/* ================= drawing ================= */
const svg = d3.select("#stage");

svg.call(zoom).on("dblclick.zoom", null);

const R = 26; // node radius
const measureCtx = document.createElement("canvas").getContext("2d");
function textWidth(s, size) {
  measureCtx.font = `600 ${size}px "IBM Plex Sans Arabic", "IBM Plex Sans", "Segoe UI", sans-serif`;
  return measureCtx.measureText(s).width;
}
let layout = null; // { nodes: Map id -> {x,y,angle}, root }

function hierarchy(full = false) {
  const build = (id) => {
    const kids = (!full && collapsed.has(id)) ? [] : kidsOf(id);
    return { id, children: kids.map(build), hidden: !full && collapsed.has(id) ? kidsOf(id).length : 0 };
  };
  return d3.hierarchy(build(tree.rootId));
}

function computeLayout(kind, full = false) {
  const root = hierarchy(full);
  const nodes = new Map();
  if (kind === "tree") {
    d3.tree().nodeSize([92, 170]).separation((a, b) => (a.parent === b.parent ? 1 : 1.25))(root);
    root.each((d) => nodes.set(d.data.id, { x: d.x, y: d.depth * 170, d }));
  } else {
    const leaves = root.leaves().length;
    const radius = Math.max(520, leaves * 92 / (2 * Math.PI));
    const depth = root.height || 1;
    d3.tree().size([2 * Math.PI, radius]).separation((a, b) => (a.parent === b.parent ? 1 : 1.3) / Math.max(1, a.depth))(root);
    root.each((d) => {
      const r = d.depth === 0 ? 0 : 120 + (d.y - radius / depth) * (radius - 120) / (radius - radius / depth || 1);
      const rr = d.depth === 0 ? 0 : (d.depth / depth) * radius;
      const a = d.x - Math.PI / 2;
      nodes.set(d.data.id, { x: Math.cos(a) * rr, y: Math.sin(a) * rr, angle: d.x, r: rr, d });
    });
    nodes.radius = radius; nodes.depth = depth;
  }
  return { root, nodes, kind };
}

function linkPath(kind, s, t2) {
  if (kind === "tree") {
    const my = (s.y + t2.y) / 2;
    return `M${s.x},${s.y + R}C${s.x},${my} ${t2.x},${my} ${t2.x},${t2.y - R}`;
  }
  return d3.linkRadial().angle((d) => d.angle).radius((d) => d.r)({ source: s, target: t2 });
}

function render(animate = false) {
  if (!tree) return;
  computeBranches();
  layout = computeLayout(view);
  const { nodes, root } = layout;
  const hl = new Set(selected ? lineage(selected) : []);

  // generation guides in circle view
  gGuides.selectAll("*").remove();
  if (view === "radial") {
    for (let i = 1; i <= nodes.depth; i++) {
      const r = (i / nodes.depth) * nodes.radius;
      gGuides.append("circle").attr("class", "gen-ring").attr("r", r);
    }
  }

  // links
  const links = root.links().map((l) => ({ id: l.target.data.id, s: nodes.get(l.source.data.id), t: nodes.get(l.target.data.id) }));
  const lk = gLinks.selectAll("path").data(links, (d) => d.id);
  lk.exit().remove();
  const lkE = lk.enter().append("path").attr("class", "link");
  lkE.merge(lk)
    .attr("d", (d) => linkPath(view, d.s, d.t))
    .attr("stroke", (d) => colorOf(d.id))
    .classed("hl", (d) => hl.has(d.id));
  if (animate) {
    lkE.merge(lk).each(function (d) {
      const len = this.getTotalLength();
      const depth = d.t.d.depth;
      d3.select(this).attr("stroke-dasharray", `${len} ${len}`).attr("stroke-dashoffset", len)
        .transition().delay(depth * 260).duration(700).ease(d3.easeCubicOut).attr("stroke-dashoffset", 0)
        .on("end", function () { d3.select(this).attr("stroke-dasharray", null); });
    });
  }

  // nodes
  const list = [...nodes.values()];
  const nd = gNodes.selectAll("g.node").data(list, (d) => d.d.data.id);
  nd.exit().remove();
  const ne = nd.enter().append("g").attr("class", "node")
    .on("click", (e, d) => { e.stopPropagation(); select(d.d.data.id); });
  ne.append("circle").attr("class", "halo").attr("r", R + 12);
  const body = ne.append("g").attr("class", "body");
  body.append("circle").attr("class", "ring").attr("r", R).attr("filter", "url(#soft)");
  body.append("circle").attr("class", "fillc").attr("r", R - 3);
  body.append("text").attr("class", "initial");
  body.append("image").attr("class", "pic").attr("clip-path", "url(#clipC)");
  ne.append("text").attr("class", "name");
  ne.append("g").attr("class", "tg");
  ne.append("g").attr("class", "me");

  const all = ne.merge(nd);
  all.classed("hl", (d) => hl.has(d.d.data.id)).classed("sel", (d) => d.d.data.id === selected)
    .attr("transform", (d) => `translate(${d.x},${d.y})`);
  all.select(".ring").attr("stroke", (d) => colorOf(d.d.data.id));
  all.select(".fillc").attr("fill", (d) => colorOf(d.d.data.id));
  all.select(".initial").attr("font-size", 20).text((d) => [...nm(P(d.d.data.id))][0]);
  all.select(".pic").each(function (d) {
    const ph = photos[d.d.data.id];
    d3.select(this).attr("href", ph || null).attr("x", -(R - 3)).attr("y", -(R - 3)).attr("width", (R - 3) * 2).attr("height", (R - 3) * 2)
      .style("display", ph ? null : "none");
  });
  all.select(".name").each(function (d) {
    const el = d3.select(this);
    const p = P(d.d.data.id);
    el.text(nm(p)).attr("font-size", d.d.depth === 0 ? 20 : 15);
    if (view === "tree") {
      el.attr("transform", null).attr("x", 0).attr("y", R + 20).attr("text-anchor", "middle");
    } else {
      if (d.d.depth === 0) { el.attr("transform", null).attr("x", 0).attr("y", R + 24).attr("text-anchor", "middle"); return; }
      let deg = d.angle * 180 / Math.PI - 90;
      const flip = d.angle > Math.PI;
      const out = !d.d.children || d.d.children.length === 0;
      // inner nodes: label below node (horizontal); leaves: rotated outward
      if (out) {
        // centre-anchored and offset by half the measured width: start/end anchoring flips
        // unpredictably for Arabic text inside an RTL page
        const half = textWidth(nm(p), 15) / 2;
        el.attr("transform", `rotate(${flip ? deg + 180 : deg})`).attr("x", flip ? -(R + 8 + half) : R + 8 + half).attr("y", 5)
          .attr("text-anchor", "middle");
      } else {
        el.attr("transform", null).attr("x", 0).attr("y", R + 18).attr("text-anchor", "middle");
      }
    }
  });
  // collapse toggles (tree view)
  all.select(".tg").each(function (d) {
    const g = d3.select(this); g.selectAll("*").remove();
    const id = d.d.data.id;
    const n = kidsOf(id).length;
    if (!n || view !== "tree") return;
    const yy = R + 44;
    g.append("circle").attr("class", "toggle").attr("cy", yy).attr("r", 10);
    g.append("text").attr("class", "toggle-t").attr("y", yy).text(collapsed.has(id) ? "+" : "−");
    g.on("click", (e) => {
      e.stopPropagation();
      collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
      render(false);
    });
  });
  // "you" tag
  all.select(".me").each(function (d) {
    const g = d3.select(this); g.selectAll("*").remove();
    if (d.d.data.id !== tree.meId) return;
    g.append("circle").attr("class", "me-pulse").attr("r", R + 4);
    const tg = g.append("g").attr("class", "me-tag").attr("transform", `translate(0,${-R - 12})`);
    tg.append("rect").attr("x", -20).attr("y", -9).attr("width", 40).attr("height", 18).attr("rx", 9);
    tg.append("text").text(t("you"));
  });

  if (animate) {
    ne.style("opacity", 0).attr("transform", (d) => {
      const par = d.d.parent ? nodes.get(d.d.parent.data.id) : d;
      return `translate(${par.x},${par.y}) scale(.2)`;
    }).transition().delay((d) => d.d.depth * 260 + 120).duration(650).ease(d3.easeBackOut.overshoot(1.4))
      .style("opacity", 1).attr("transform", (d) => `translate(${d.x},${d.y})`);
  }
  updateStats();
}

function fit(duration = 750) {
  if (!layout) return;
  const b = gNodes.node().getBBox();
  const W = innerWidth, H = innerHeight;
  const pad = 80;
  const k = Math.min(1.2, Math.min((W - pad) / (b.width || 1), (H - 200) / (b.height || 1)));
  const tx = W / 2 - (b.x + b.width / 2) * k, ty = (H + 60) / 2 - (b.y + b.height / 2) * k;
  svg.transition().duration(duration).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
}
function focus(id, k = 1, duration = 900) {
  const n = layout?.nodes.get(id);
  if (!n) return;
  const W = innerWidth, H = innerHeight;
  const panelOpen = document.getElementById("panel").classList.contains("open") && W > 860;
  const shift = panelOpen ? (lang === "ar" ? 200 : -200) : 0;
  svg.transition().duration(duration).ease(d3.easeCubicInOut)
    .call(zoom.transform, d3.zoomIdentity.translate(W / 2 + shift - n.x * k, (W > 860 ? H / 2 : H * 0.28) + 30 - n.y * k).scale(k));
}
function expandTo(id) { lineage(id).slice(1).forEach((a) => collapsed.delete(a)); }

/* ================= panel ================= */
const panel = document.getElementById("panel");
function select(id, { zoomTo = true } = {}) {
  selected = id;
  expandTo(id);
  render(false);
  openPanel(id);
  if (zoomTo) focus(id, Math.max(0.8, d3.zoomTransform(svg.node()).k));
}
function closePanel() { panel.classList.remove("open"); selected = null; render(false); }
function avatarHtml(id) { const ph = photos[id]; return ph ? `<img alt="" src="${ph}">` : esc([...nm(P(id))][0]); }

function openPanel(id) {
  const p = P(id);
  if (!p) return;
  const col = colorOf(id);
  panel.style.setProperty("--branch", col);
  document.getElementById("pAvatar").innerHTML = avatarHtml(id);
  document.getElementById("pOwnerTag").classList.toggle("hide", !isOwner);
  document.getElementById("pName").textContent = nm(p) + (id === tree.meId ? "  ⭐" : "");
  const other = lang === "ar" ? p.en : p.ar;
  const years = [p.born, p.died].filter(Boolean).join(" – ");
  document.getElementById("pAlt").textContent = [other, years].filter(Boolean).join(" · ");
  const line = lineage(id);
  document.getElementById("pLineage").innerHTML = line.map((a, i) => {
    const link = `<a data-go="${a}">${esc(nm(P(a)))}</a>`;
    if (i === 0) return link;

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols = ["#c39a3a", "#2f7d6b", "#c0612b", "#5b6fc0", "#e3c26b", "#b2457a"];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement("div"); c.className = "confetti";
    c.style.background = cols[i % cols.length]; c.style.left = "50%"; c.style.top = "55%";
    document.body.appendChild(c);
    const ang = Math.random() * Math.PI * 2, dist = 120 + Math.random() * 280;
    c.animate([
      { transform: "translate(-50%,-50%) rotate(0)", opacity: 1 },
      { transform: `translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist - 120}px) rotate(${Math.random() * 720}deg)`, opacity: 1, offset: .6 },
      { transform: `translate(${Math.cos(ang) * dist * 1.1}px, ${Math.sin(ang) * dist + 200}px) rotate(${Math.random() * 900}deg)`, opacity: 0 },

/* image -> small square JPEG data URL */
function readPhoto(file, size = 360) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith("image/")) { rej(new Error("not image")); return; }
    const img = new Image();
    img.onload = () => {
      const s = Math.min(img.width, img.height);
      const c = document.createElement("canvas"); c.width = c.height = size;
      const x = c.getContext("2d");
      x.imageSmoothingQuality = "high";
      x.drawImage(img, (img.width - s) / 2, (img.height - s) / 2 * 0.6, s, s, 0, 0, size, size);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}
function wireDrop(root, onPhoto) {
  const drop = root.querySelector(".drop"), inp = root.querySelector("input[type=file]");
  drop.onclick = () => inp.click();
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); handle(e.dataTransfer.files[0]); };
  inp.onchange = () => handle(inp.files[0]);
  async function handle(f) {
    try { const url = await readPhoto(f); drop.innerHTML = `<img alt="" src="${url}">`; onPhoto(url); } catch (e) { toast(t("needPhoto")); }
  }
}

function inbox() {
  const line = (id) => (P(id) ? `<b>${esc(nm(P(id)))}</b> <span class="meta">${esc(lineage(id).slice(1, 3).map((a) => nm(P(a))).join(" ← "))}</span>` : "—");

    return `<div class="req" data-r="${r.id}">
      <div class="pic">${r.photo ? `<img alt="" src="${r.photo}">` : (r.type === "add" ? "🌱" : "✎")}</div>
      <div><div class="meta">${t("from")} <b>${esc(r.by)}</b>${r.contact ? " · " + esc(r.contact) : ""} · ${when}</div>
      <div class="what">${what}</div>${r.note ? `<div class="meta">“${esc(r.note)}”</div>` : ""}
      <div class="foot"><button class="btn primary" data-ok="${r.id}">✓ ${t("approve")}</button><button class="btn danger" data-no="${r.id}">✕ ${t("reject")}</button></div></div></div>`;
  }).join("");
  openModal(`<h3>${t("inbox")}</h3><p class="sub">${t("inboxSub")}</p>${items || `<div class="empty">${t("noReq")}</div>`}
    <div class="foot"><button class="btn" data-close>✕</button></div>`, true);
  sheet.onclick = async (e) => {
    const ok = e.target.closest("[data-ok]")?.dataset.ok, no = e.target.closest("[data-no]")?.dataset.no;
    const rid = ok || no;
    if (!rid) return;
    const r = pending.find((x) => x.id === rid);
    if (!r) return;
    e.target.closest("button").disabled = true;
    try {
      if (ok) {
        let focusId = r.targetId || r.parentId;
        if (r.type === "add" && P(r.parentId)) {
          const nid = newId();
          const rec = { ar: r.ar || "", en: r.en || "", gender: r.gender || "m", parent: r.parentId,
            order: Math.max(0, ...Object.values(tree.people).map((x) => x.order || 0)) + 1 };
          Object.keys(rec).forEach((k) => rec[k] === "" && delete rec[k]);
          await updateDoc(doc(db, "tree", "main"), { [`people.${nid}`]: rec, updatedAt: serverTimestamp() });
          if (r.photo) { await setDoc(doc(db, "photos", nid), { data: r.photo }); photos[nid] = r.photo; }
          focusId = nid;
        }
        if (r.type === "edit" && P(r.targetId)) {
          const upd = { updatedAt: serverTimestamp() };
          if (r.ar) upd[`people.${r.targetId}.ar`] = r.ar;
          if (r.en) upd[`people.${r.targetId}.en`] = r.en;
          if (r.gender) upd[`people.${r.targetId}.gender`] = r.gender;
          await updateDoc(doc(db, "tree", "main"), upd);
          if (r.photo) { await setDoc(doc(db, "photos", r.targetId), { data: r.photo }); photos[r.targetId] = r.photo; }
        }
        if (r.type === "photo" && r.photo && P(r.targetId)) {
          await setDoc(doc(db, "photos", r.targetId), { data: r.photo }); photos[r.targetId] = r.photo;
        }
        await deleteDoc(doc(db, "requests", rid));
        toast(t("approved")); confetti();
        pending = pending.filter((x) => x.id !== rid);
        setTimeout(() => { if (focusId && P(focusId)) select(focusId); }, 600);
      } else {
        await deleteDoc(doc(db, "requests", rid));
        pending = pending.filter((x) => x.id !== rid);
        toast(t("rejected"));
      }
      const b = document.getElementById("inboxCount"); b.textContent = pending.length; b.classList.toggle("hide", !pending.length);
      sheet.querySelector(`[data-r="${rid}"]`)?.remove();
      if (!pending.length) closeModal();
    } catch (err) { console.error(err); toast(t("err")); }
  };
}

function download(name, blob) {

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function importJson(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data.people || !data.rootId) throw new Error("bad file");
    await setDoc(doc(db, "tree", "main"), { rootId: data.rootId, meId: data.meId || null, people: data.people, updatedAt: serverTimestamp() });
    if (data.photos) for (const [k, v] of Object.entries(data.photos)) await setDoc(doc(db, "photos", k), { data: v });
    closeModal(); toast(t("imported")); confetti();
  } catch (e) { console.error(e); toast(t("err")); }
}

/* ================= poster export ================= */
document.getElementById("btnPoster").onclick = () => {
  let kind = view, plang = lang;
  openModal(`<h3>${t("posterTitle")}</h3><p class="sub">${t("posterSub")}</p>
    <div class="opts" id="pk"><button class="opt" data-k="tree"><b>${t("pTree")}</b><span>${t("pTreeSub")}</span></button><button class="opt" data-k="radial"><b>${t("pCircle")}</b><span>${t("pCircleSub")}</span></button></div>
    <div class="field"><label>${t("pLang")}</label><div class="tabs" id="pl"><button data-l="ar">العربية</button><button data-l="en">English</button></div></div>
    <div class="foot" style="justify-content:stretch"><button class="btn primary" id="xPng" style="flex:1;justify-content:center">⬇ ${t("pPng")}</button><button class="btn" id="xSvg" style="flex:1;justify-content:center">⬇ ${t("pSvg")}</button><button class="btn" id="xPrint" style="flex:1;justify-content:center">🖨 ${t("pPrint")}</button></div>`);
  const sync = () => {
    sheet.querySelectorAll("[data-k]").forEach((b) => b.classList.toggle("on", b.dataset.k === kind));
    sheet.querySelectorAll("[data-l]").forEach((b) => b.classList.toggle("on", b.dataset.l === plang));
  };
  sheet.querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => { kind = b.dataset.k; sync(); }));
  sheet.querySelectorAll("[data-l]").forEach((b) => (b.onclick = () => { plang = b.dataset.l; sync(); }));
  sync();
  const go = async (fmt) => {
    toast(t("making"));
    const { svgText, w, h } = posterSvg(kind, plang);
    const stamp = new Date().toISOString().slice(0, 10);
    const base = `omran-family-tree-${kind === "radial" ? "circle" : "tree"}-${plang}-${stamp}`;
    if (fmt === "svg") { download(`${base}.svg`, new Blob([svgText], { type: "image/svg+xml" })); return; }
    if (fmt === "print") {
      const wnd = window.open("", "_blank");
      if (!wnd) { toast(t("err")); return; }
      wnd.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(T[plang].posterBy)}</title><style>@page{size:${w > h ? "landscape" : "portrait"};margin:8mm}html,body{margin:0}svg{width:100%;height:auto;display:block}</style></head><body>${svgText}<script>setTimeout(()=>print(),600)<\/script></body></html>`);
      wnd.document.close(); return;
    }
    const maxSide = 14000;
    const scale = Math.min(3, maxSide / Math.max(w, h));
    const img = new Image();
    const url = URL.createObjectURL(new Blob([svgText], { type: "image/svg+xml;charset=utf-8" }));
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      const x = c.getContext("2d"); x.scale(scale, scale); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob((b) => { if (b) download(`${base}.png`, b); else toast(t("err")); }, "image/png");
    };
    img.onerror = () => { toast(t("err")); };
    img.src = url;
  };
  sheet.querySelector("#xPng").onclick = () => go("png");
  sheet.querySelector("#xSvg").onclick = () => go("svg");
  sheet.querySelector("#xPrint").onclick = () => go("print");
};

function posterSvg(kind, plang) {
  const L = computeLayout(kind, true);
  const nodes = [...L.nodes.values()];
  const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
  const pad = kind === "tree" ? 140 : 260;
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad, minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
  const header = 260, footer = 120;
  const w = Math.round(maxX - minX), h = Math.round(maxY - minY + header + footer);
  const ox = -minX, oy = -minY + header;
  const fontAr = "'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif", fontEn = "'IBM Plex Sans','Segoe UI',Arial,sans-serif";
  const font = plang === "ar" ? fontAr : fontEn;
  const nameOf = (id) => esc(nm(P(id), plang));
  let s = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" font-family="${font}">`;
  s += `<defs><clipPath id="c" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#fbf4e3"/><stop offset="1" stop-color="#efe3c8"/></radialGradient></defs>`;
  s += `<rect width="${w}" height="${h}" fill="url(#bg)"/>`;
  s += `<rect x="24" y="24" width="${w - 48}" height="${h - 48}" fill="none" stroke="#c39a3a" stroke-width="3" rx="28"/>`;
  s += `<rect x="38" y="38" width="${w - 76}" height="${h - 76}" fill="none" stroke="#c39a3a" stroke-width="1" rx="20" opacity=".6"/>`;
  s += `<text x="${w / 2}" y="140" text-anchor="middle" font-size="84" font-weight="700" fill="#2f5d50">${esc(T[plang].posterBy)}</text>`;
  s += `<text x="${w / 2}" y="200" text-anchor="middle" font-size="30" fill="#776c5a">${esc(T[plang].subtitle)} · ${Object.keys(tree.people).length} ${esc(T[plang].people)} · ${L.root.height + 1} ${esc(T[plang].generations)}</text>`;
  s += `<g transform="translate(${ox},${oy})">`;
  if (kind === "radial") for (let i = 1; i <= L.nodes.depth; i++) s += `<circle r="${(i / L.nodes.depth) * L.nodes.radius}" fill="none" stroke="#d9cbae" stroke-dasharray="3 7"/>`;
  L.root.links().forEach((l) => {
    const a = L.nodes.get(l.source.data.id), b = L.nodes.get(l.target.data.id);
    s += `<path d="${linkPath(kind, a, b)}" fill="none" stroke="${colorOf(l.target.data.id)}" stroke-width="2.6" stroke-linecap="round" opacity=".8"/>`;
  });
  nodes.forEach((n) => {
    const id = n.d.data.id, col = colorOf(id), ph = photos[id];
    s += `<g transform="translate(${n.x},${n.y})">`;
    if (id === tree.meId) s += `<circle r="${R + 9}" fill="#e3c26b" opacity=".55"/>`;
    s += `<circle r="${R}" fill="#fffdf7" stroke="${col}" stroke-width="3"/><circle r="${R - 3}" fill="${col}"/>`;
    if (ph) s += `<image href="${ph}" xlink:href="${ph}" x="${-(R - 3)}" y="${-(R - 3)}" width="${(R - 3) * 2}" height="${(R - 3) * 2}" clip-path="url(#c)" preserveAspectRatio="xMidYMid slice"/>`;
    else s += `<text text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="#fff">${esc([...nm(P(id), plang)][0])}</text>`;
    const fs = n.d.depth === 0 ? 22 : 15;
    if (kind === "tree" || n.d.depth === 0 || (n.d.children && n.d.children.length)) {
      s += `<text y="${R + 20}" text-anchor="middle" font-size="${fs}" font-weight="600" fill="#2a2620" stroke="#fbf4e3" stroke-width="4" paint-order="stroke">${nameOf(id)}</text>`;
    } else {
      const deg = n.angle * 180 / Math.PI - 90, flip = n.angle > Math.PI;
      const half = textWidth(nm(P(id), plang), fs) / 2;
      s += `<text transform="rotate(${flip ? deg + 180 : deg})" x="${flip ? -(R + 8 + half) : R + 8 + half}" y="5" text-anchor="middle" font-size="${fs}" font-weight="600" fill="#2a2620">${nameOf(id)}</text>`;
    }
    s += `</g>`;
  });
  s += `</g>`;
  s += `<text x="${w / 2}" y="${h - 60}" text-anchor="middle" font-size="22" fill="#776c5a">ahmadellahib.dev/family · ${new Date().toLocaleDateString(plang === "ar" ? "ar-LB" : "en-GB", { year: "numeric", month: "long" })}</text>`;
  s += `</svg>`;
  return { svgText: s, w, h };
}

/* ================= misc controls ================= */
document.getElementById("zIn").onclick = () => svg.transition().call(zoom.scaleBy, 1.35);
document.getElementById("zOut").onclick = () => svg.transition().call(zoom.scaleBy, 1 / 1.35);
document.getElementById("zFit").onclick = () => fit();
document.getElementById("zMe").onclick = () => tree?.meId && select(tree.meId);
const setView = (v) => {
  clearTimeout(introTimer);
  view = v;
  document.getElementById("vTree").classList.toggle("on", v === "tree");
  document.getElementById("vRadial").classList.toggle("on", v === "radial");
  if (v === "radial") collapsed.clear();
  gLinks.selectAll("*").remove(); gNodes.selectAll("*").remove();
  render(true); setTimeout(() => fit(900), 60);
};
document.getElementById("vTree").onclick = () => setView("tree");
document.getElementById("vRadial").onclick = () => setView("radial");
document.getElementById("btnLang").onclick = () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("ft-lang", lang); } catch (e) { /* storage blocked */ }
  applyLang(); render(false); if (selected) openPanel(selected);
};
document.getElementById("btnTheme").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("ft-theme", root.dataset.theme); } catch (e) { /* storage blocked */ }
  render(false);
};
try { const th = localStorage.getItem("ft-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* storage blocked */ }
function updateStats() {
  if (!tree) return;
  const ids = Object.keys(tree.people);
  document.getElementById("sPeople").textContent = ids.length;
  document.getElementById("sGens").textContent = Math.max(...ids.map(genOf));
  document.getElementById("sPhotos").textContent = Object.keys(photos).filter((k) => tree.people[k]).length;
}
(function leaves() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.getElementById("leaves");
  const cols = ["#7fa34a", "#c39a3a", "#3f7a68", "#c0612b"];
  for (let i = 0; i < 9; i++) {
    const l = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    l.setAttribute("viewBox", "0 0 24 24"); l.classList.add("leaf");
    l.innerHTML = `<path d="M5 19C5 10 11 4 20 4c0 9-6 15-15 15zM5 19l9-9" fill="${cols[i % 4]}" stroke="${cols[i % 4]}" stroke-width="1.2"/>`;
    l.style.left = `${Math.random() * 100}%`; l.style.animationDuration = `${16 + Math.random() * 14}s`; l.style.animationDelay = `${-Math.random() * 20}s`;
    box.appendChild(l);
  }
})();
addEventListener("resize", () => { if (!selected) fit(0); });

/* ================= data loading ================= */
applyLang();
const loader = document.getElementById("loader");
function showEmpty() {
  loader.classList.add("done");
  openModal(`<h3>🌱 ${t("empty")}</h3><p class="sub">${isOwner ? "" : ""}</p>
    ${isOwner ? `<label class="btn primary">⬆ ${t("importJson")}<input type="file" id="oImport" accept=".json,application/json" hidden></label>` : `<button class="btn" id="eSign">${t("signIn")}</button>`}`);
  sheet.querySelector("#oImport")?.addEventListener("change", (e) => importJson(e.target.files[0]));
  sheet.querySelector("#eSign")?.addEventListener("click", () => { closeModal(); document.getElementById("btnOwner").click(); });
}
async function loadPhotos() {
  try {
    const snap = await getDocs(collection(db, "photos"));
    photos = {}; snap.forEach((d) => { photos[d.id] = d.data().data; });
    render(false); if (selected) openPanel(selected);
  } catch (e) { console.error(e); }
}
let photosLoaded = false;
function firstRender() {
  gLinks.selectAll("*").remove(); gNodes.selectAll("*").remove();
  render(true);
  loader.classList.add("done");
  // open on the whole tree, then glide to "you"
  fit(0);
  introTimer = setTimeout(() => { if (tree.meId && P(tree.meId)) focus(tree.meId, 0.95, 1600); }, 2300);
}
let introTimer = 0;
// Local preview only: ?local=1 reads seed.json next to the page (never published).
const LOCAL = new URLSearchParams(location.search).has("local");
if (LOCAL) {
  fetch("seed.json").then((r) => r.json()).then((d) => { tree = { rootId: d.rootId, meId: d.meId, people: d.people }; firstDraw = false; firstRender(); })
    .catch((e) => { console.error(e); loader.classList.add("done"); });
} else onSnapshot(doc(db, "tree", "main"), (snap) => {
  if (!snap.exists()) { tree = null; showEmpty(); return; }
  const d = snap.data();
  const had = !!tree;
  tree = { rootId: d.rootId, meId: d.meId, people: d.people || {} };
  if (modal.classList.contains("open") && sheet.textContent.includes(t("empty"))) closeModal();
  if (!had || firstDraw) {
    firstDraw = false;
    firstRender();
  } else {
    render(false); if (selected && P(selected)) openPanel(selected); else if (selected) closePanel();
  }
  if (!photosLoaded) { photosLoaded = true; loadPhotos(); }
}, (err) => { console.error(err); loader.classList.add("done"); toast(t("err")); });

onAuthStateChanged(auth, async (u) => {
  user = u;
  isOwner = false;
  if (u) {
    try { await getDocs(query(collection(db, "requests"), limit(1))); isOwner = true; } catch (e) { isOwner = false; }
  }
  document.getElementById("btnInbox").classList.toggle("hide", !isOwner);
  document.getElementById("btnOwner").style.color = isOwner ? "var(--gold)" : "";
  if (u && !isOwner) toast(t("notOwner"));
  if (isOwner) await loadPending();
  if (selected) openPanel(selected);
  if (!tree && modal.classList.contains("open") && sheet.textContent.includes(t("empty"))) showEmpty();
});
</script>
